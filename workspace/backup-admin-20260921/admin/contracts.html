<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合同管理 - 职小法后台</title>
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-table/bootstrap-table.min.css">
  <link rel="stylesheet" href="../css/app.css?v=20260916w">
</head>
<body>

<div class="zf-app">
  <main class="zf-main">
    <header class="zf-topbar"></header>

    <section class="zf-content">
      <div id="admin-nav"></div>

      <div class="zf-card">
        <div class="zf-card__head"><div><h3 class="zf-card__title">合同与风险点管理</h3>
          <p class="zf-card__desc">查看合同审查记录与逐条风险点明细</p></div></div>

        <div class="zf-filter">
          <input class="zf-form-control" type="text" id="f-keyword" placeholder="文件名 / 上传人 / 甲方 / 乙方">
          <select class="zf-form-control" id="f-risk">
            <option value="">全部风险等级</option>
            <option value="高">高风险</option>
            <option value="中">中风险</option>
            <option value="低">低风险</option>
          </select>
          <button class="zf-btn zf-btn--primary" id="search-btn"><i class="bi bi-search"></i>查询</button>
          <button class="zf-btn zf-btn--ghost" id="reset-btn"><i class="bi bi-arrow-clockwise"></i>重置</button>
        </div>

        <table id="contract-table" class="zf-table"></table>
      </div>
    </section>
  </main>
</div>

<!-- 合同详情模态框 -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">合同详情</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detail-body"><div class="zf-loading">加载中…</div></div>
      <div class="modal-footer">
        <button type="button" class="zf-btn zf-btn--ghost" data-bs-dismiss="modal">关闭</button>
      </div>
    </div>
  </div>
</div>

<script src="../vendor/jquery/jquery.min.js"></script>
<script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../vendor/bootstrap-table/bootstrap-table.min.js"></script>
<script src="../vendor/bootstrap-table/bootstrap-table-zh-CN.min.js"></script>
<script src="../js/common.js?v=20260916w"></script>
<script src="admin-common.js"></script>
<script>
/**
 * @file contracts.html —— 合同与风险点管理
 * @description 分页展示合同审查记录，支持关键词/风险等级筛选；
 *              查看详情（基本信息 + 逐条风险点明细），删除记录。
 */
(function ($, ZF) {
  'use strict';

  /** 当前操作行 */
  var current = null;

  ZF.initPage({ active: 'contracts', title: '合同管理', sub: '合同审查与风险点明细', needAdmin: true })
    .then(function () {
      ZF.renderAdminNav('contracts');
      initTable();
      bindFilters();
    });

  /** 转义或占位 */
  function escOrDash(v) { return v ? ZF.escape(v) : '<span style="color:var(--zf-ink-3)">-</span>'; }

  /** 操作列 */
  function operateFormatter(value, row) {
    return [
      '<button class="zf-btn zf-btn--ghost zf-btn--sm js-detail"><i class="bi bi-eye"></i>详情</button>',
      '<button class="zf-btn zf-btn--danger zf-btn--sm js-delete"><i class="bi bi-trash"></i>删除</button>'
    ].join(' ');
  }

  /** 初始化表格 */
  function initTable() {
    ZF.initAdminTable('#contract-table', '/contracts', {
      pageSize: 10,
      queryParams: function () {
        return {
          keyword: $.trim($('#f-keyword').val()),
          riskLevel: $('#f-risk').val()
        };
      },
      columns: [
        { field: 'id', title: 'ID', width: 64 },
        { field: 'userNickname', title: '上传人', formatter: function (v) { return ZF.escape(v || '匿名'); } },
        { field: 'fileName', title: '文件名', formatter: function (v) { return ZF.escape(ZF.truncate(v, 30)); } },
        { field: 'contractType', title: '类型', formatter: escOrDash },
        { field: 'partyA', title: '甲方', formatter: function (v) { return ZF.escape(ZF.truncate(v, 14)); } },
        { field: 'partyB', title: '乙方', formatter: function (v) { return ZF.escape(ZF.truncate(v, 14)); } },
        { field: 'signDate', title: '签约日期', formatter: function (v) { return ZF.escape(v || '-'); } },
        { field: 'riskLevel', title: '风险等级', formatter: function (v) { return ZF.riskBadge(v); } },
        { field: 'riskCount', title: '风险点', formatter: function (v) { return ZF.escape(String(v || 0)); } },
        { field: 'createdAt', title: '时间', formatter: function (v) { return ZF.dt(v); } },
        { field: 'operate', title: '操作', formatter: operateFormatter, events: operateEvents }
      ]
    });
  }

  /** 操作事件 */
  var operateEvents = {
    'click .js-detail': function (e, v, row) { openDetail(row); },
    'click .js-delete': function (e, v, row) { removeContract(row); }
  };

  /** 绑定筛选 */
  function bindFilters() {
    $('#search-btn').on('click', function () { ZF.refreshTable('#contract-table'); });
    $('#reset-btn').on('click', function () {
      $('#f-keyword').val(''); $('#f-risk').val('');
      ZF.refreshTable('#contract-table');
    });
    $('#f-keyword').on('keydown', function (e) {
      if (e.key === 'Enter') { ZF.refreshTable('#contract-table'); }
    });
  }

  /** 打开详情：基本信息 + 逐条风险点 */
  function openDetail(row) {
    current = row;
    var $body = $('#detail-body');
    ZF.renderLoading($body, '加载详情…');
    new bootstrap.Modal($('#detailModal')[0]).show();
    ZF.get('/contracts/' + row.id).then(function (d) {
      d = d || row;
      var html = ['<div class="zf-grid zf-grid--2" style="align-items:start">'];
      html.push('<div>');
      html.push(infoRow('上传人', d.userNickname || '匿名'));
      html.push(infoRow('文件名', d.fileName));
      html.push(infoRow('合同类型', d.contractType));
      html.push(infoRow('甲方', d.partyA));
      html.push(infoRow('乙方', d.partyB));
      html.push(infoRow('签约日期', d.signDate));
      html.push('</div><div>');
      html.push(infoRow('风险等级', ZF.riskBadge(d.riskLevel)));
      html.push(infoRow('风险点数量', d.riskCount));
      html.push(infoRow('创建时间', ZF.dt(d.createdAt)));
      html.push('</div></div>');

      var risks = d.risks || [];
      html.push('<p class="zf-subtitle" style="margin-top:18px">风险点明细（' + risks.length + '）</p>');
      if (!risks.length) {
        html.push('<p style="color:var(--zf-ink-3);font-size:12.5px">未发现风险点</p>');
      } else {
        risks.forEach(function (r, i) {
          html.push('<div class="zf-risk">');
          html.push('<div class="zf-risk__head">' + ZF.riskBadge(r.riskLevel) +
            (r.clauseNo ? ' <span class="zf-risk__clause">条款 ' + ZF.escape(r.clauseNo) + '</span>' : '') +
            ' <span class="zf-risk__clause">#' + (i + 1) + '</span></div>');
          if (r.clauseContent) {
            html.push('<div class="zf-quote">' + ZF.escape(r.clauseContent) + '</div>');
          }
          html.push('<p class="zf-risk__desc"><b>风险说明：</b>' + ZF.escape(r.riskDesc || '-') + '</p>');
          html.push('<p class="zf-risk__sug"><b>修改建议：</b>' + ZF.escape(r.suggestion || '-') + '</p>');
          if (r.lawName) {
            html.push('<p class="zf-risk__law"><i class="bi bi-book"></i> ' + ZF.escape(r.lawName) +
              (r.lawArticleNo ? ' ' + ZF.escape(r.lawArticleNo) : '') + '</p>');
          }
          html.push('</div>');
        });
      }
      $body.html(html.join(''));
    }).catch(function () {
      ZF.renderEmpty($body, '详情加载失败');
    });
  }

  /** 渲染一行基本信息 */
  function infoRow(label, value) {
    return '<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--zf-border)">' +
      '<span style="width:84px;color:var(--zf-ink-3);font-size:12.5px">' + ZF.escape(label) + '</span>' +
      '<span style="flex:1;font-size:13px">' + (value || '<span style="color:var(--zf-ink-3)">-</span>') + '</span></div>';
  }

  /** 删除合同 */
  function removeContract(row) {
    ZF.confirm('确定删除该合同审查记录吗？相关风险点也会一并删除。').then(function (ok) {
      if (!ok) { return; }
      ZF.del('/contracts/' + row.id).then(function () {
        ZF.toast('已删除', 'success');
        $('#contract-table').bootstrapTable('refresh');
      }).catch(function () { /* 统一提示 */ });
    });
  }
})(jQuery, window.ZF);
</script>
</body>
</html>
