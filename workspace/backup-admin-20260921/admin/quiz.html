<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>题库管理 - 职小法后台</title>
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-table/bootstrap-table.min.css">
  <link rel="stylesheet" href="../css/app.css?v=20260916w">
</head>
<body>

<div class="zf-app">
  <main class="zf-main">
    <header class="zf-topbar"></header>

    <section class="zf-content">
      <div id="admin-nav"></div>

      <div class="zf-card">
        <div class="zf-card__head">
          <div><h3 class="zf-card__title">题库管理</h3>
            <p class="zf-card__desc">维护法律知识自测题目</p></div>
          <button class="zf-btn zf-btn--primary" id="add-btn"><i class="bi bi-plus-lg"></i>新增题目</button>
        </div>

        <div class="zf-filter">
          <input class="zf-form-control" type="text" id="f-keyword" placeholder="题干 / 分类">
          <input class="zf-form-control" type="text" id="f-category" placeholder="分类">
          <button class="zf-btn zf-btn--primary" id="search-btn"><i class="bi bi-search"></i>查询</button>
          <button class="zf-btn zf-btn--ghost" id="reset-btn"><i class="bi bi-arrow-clockwise"></i>重置</button>
        </div>

        <table id="quiz-table" class="zf-table"></table>
      </div>
    </section>
  </main>
</div>

<!-- 题目编辑模态框 -->
<div class="modal fade" id="quizModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="quiz-modal-title">新增题目</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="quiz-form" novalidate>
        <div class="modal-body">
          <input type="hidden" name="id">
          <div class="zf-grid zf-grid--2">
            <div class="zf-field">
              <label class="zf-form-label" for="q-category">分类 <span style="color:var(--zf-danger)">*</span></label>
              <input class="zf-form-control" type="text" name="category" id="q-category" maxlength="30">
              <div class="zf-form-error"></div>
            </div>
            <div class="zf-field">
              <label class="zf-form-label" for="q-difficulty">难度</label>
              <input class="zf-form-control" type="text" name="difficulty" id="q-difficulty" maxlength="20" placeholder="如 简单/中等/困难">
            </div>
          </div>
          <div class="zf-field">
            <label class="zf-form-label" for="q-question">题干 <span style="color:var(--zf-danger)">*</span></label>
            <textarea class="zf-form-control" name="question" id="q-question" rows="2"></textarea>
            <div class="zf-form-error"></div>
          </div>
          <div class="zf-grid zf-grid--2">
            <div class="zf-field">
              <label class="zf-form-label" for="q-optionA">选项 A <span style="color:var(--zf-danger)">*</span></label>
              <input class="zf-form-control" type="text" name="optionA" id="q-optionA" maxlength="120">
              <div class="zf-form-error"></div>
            </div>
            <div class="zf-field">
              <label class="zf-form-label" for="q-optionB">选项 B <span style="color:var(--zf-danger)">*</span></label>
              <input class="zf-form-control" type="text" name="optionB" id="q-optionB" maxlength="120">
              <div class="zf-form-error"></div>
            </div>
            <div class="zf-field">
              <label class="zf-form-label" for="q-optionC">选项 C <span style="color:var(--zf-danger)">*</span></label>
              <input class="zf-form-control" type="text" name="optionC" id="q-optionC" maxlength="120">
              <div class="zf-form-error"></div>
            </div>
            <div class="zf-field">
              <label class="zf-form-label" for="q-optionD">选项 D <span style="color:var(--zf-danger)">*</span></label>
              <input class="zf-form-control" type="text" name="optionD" id="q-optionD" maxlength="120">
              <div class="zf-form-error"></div>
            </div>
          </div>
          <div class="zf-grid zf-grid--2">
            <div class="zf-field">
              <label class="zf-form-label" for="q-correct">正确答案 <span style="color:var(--zf-danger)">*</span></label>
              <select class="zf-form-control" name="correctOption" id="q-correct">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
              </select>
              <div class="zf-form-error"></div>
            </div>
          </div>
          <div class="zf-field">
            <label class="zf-form-label" for="q-explanation">解析</label>
            <textarea class="zf-form-control" name="explanation" id="q-explanation" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="zf-btn zf-btn--ghost" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="zf-btn zf-btn--primary" id="quiz-save"><i class="bi bi-check2"></i>保存</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="../vendor/jquery/jquery.min.js"></script>
<script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../vendor/bootstrap-table/bootstrap-table.min.js"></script>
<script src="../vendor/bootstrap-table/bootstrap-table-zh-CN.min.js"></script>
<script src="../js/common.js?v=20260916w"></script>
<script src="admin-common.js"></script>
<script>
/**
 * @file quiz.html —— 题库管理
 * @description 法律自测题目的列表、新增、编辑、删除与分类筛选。
 */
(function ($, ZF) {
  'use strict';

  /** 当前编辑行的 id（新增时为 null） */
  var editingId = null;

  ZF.initPage({ active: 'quiz', title: '题库管理', sub: '法律知识自测题库维护', needAdmin: true })
    .then(function () {
      ZF.renderAdminNav('quiz');
      initTable();
      bindFilters();
      bindAdd();
      bindQuizForm();
    });

  /** 正确答案徽标 */
  function correctBadge(opt) {
    return '<span class="zf-badge zf-badge--ok">答案 ' + ZF.escape(opt || '-') + '</span>';
  }

  /** 操作列 */
  function operateFormatter(value, row) {
    return [
      '<button class="zf-btn zf-btn--ghost zf-btn--sm js-edit"><i class="bi bi-pencil"></i>编辑</button>',
      '<button class="zf-btn zf-btn--danger zf-btn--sm js-delete"><i class="bi bi-trash"></i>删除</button>'
    ].join(' ');
  }

  /** 初始化表格 */
  function initTable() {
    ZF.initAdminTable('#quiz-table', '/quiz/page', {
      pageSize: 10,
      queryParams: function () {
        return {
          keyword: $.trim($('#f-keyword').val()),
          category: $.trim($('#f-category').val())
        };
      },
      columns: [
        { field: 'id', title: 'ID', width: 64 },
        { field: 'category', title: '分类', formatter: function (v) { return v ? ZF.escape(v) : '<span style="color:var(--zf-ink-3)">-</span>'; } },
        { field: 'question', title: '题干', formatter: function (v) { return ZF.escape(ZF.truncate(v, 40)); } },
        { field: 'correctOption', title: '正确答案', formatter: correctBadge },
        { field: 'difficulty', title: '难度', formatter: function (v) { return ZF.escape(v || '-'); } },
        { field: 'operate', title: '操作', formatter: operateFormatter, events: operateEvents }
      ]
    });
  }

  /** 操作事件 */
  var operateEvents = {
    'click .js-edit': function (e, v, row) { openEdit(row); },
    'click .js-delete': function (e, v, row) { removeQuiz(row); }
  };

  /** 绑定筛选 */
  function bindFilters() {
    $('#search-btn').on('click', function () { ZF.refreshTable('#quiz-table'); });
    $('#reset-btn').on('click', function () {
      $('#f-keyword').val(''); $('#f-category').val('');
      ZF.refreshTable('#quiz-table');
    });
    $('#f-keyword, #f-category').on('keydown', function (e) {
      if (e.key === 'Enter') { ZF.refreshTable('#quiz-table'); }
    });
  }

  /** 打开新增 */
  function bindAdd() {
    $('#add-btn').on('click', function () {
      editingId = null;
      $('#quiz-modal-title').text('新增题目');
      $('#quiz-form')[0].reset();
      $('#quiz-form').find('[name=id]').val('');
      $('#quiz-form').find('[name=correctOption]').val('A');
      ZF.clearValidate($('#quiz-form'));
      new bootstrap.Modal($('#quizModal')[0]).show();
    });
  }

  /** 打开编辑并回填 */
  function openEdit(row) {
    editingId = row.id;
    $('#quiz-modal-title').text('编辑题目');
    var $f = $('#quiz-form');
    ZF.clearValidate($f);
    $f.find('[name=id]').val(row.id);
    $f.find('[name=category]').val(row.category || '');
    $f.find('[name=difficulty]').val(row.difficulty || '');
    $f.find('[name=question]').val(row.question || '');
    $f.find('[name=optionA]').val(row.optionA || '');
    $f.find('[name=optionB]').val(row.optionB || '');
    $f.find('[name=optionC]').val(row.optionC || '');
    $f.find('[name=optionD]').val(row.optionD || '');
    $f.find('[name=correctOption]').val(row.correctOption || 'A');
    $f.find('[name=explanation]').val(row.explanation || '');
    new bootstrap.Modal($('#quizModal')[0]).show();
  }

  /** 保存（新增/编辑） */
  function bindQuizForm() {
    $('#quiz-form').on('submit', function (e) {
      e.preventDefault();
      var $form = $(this);
      ZF.clearValidate($form);
      if (!ZF.validate($form, {
        category: { required: true, message: '分类不能为空' },
        question: { required: true, message: '题干不能为空' },
        optionA: { required: true, message: '选项 A 不能为空' },
        optionB: { required: true, message: '选项 B 不能为空' },
        optionC: { required: true, message: '选项 C 不能为空' },
        optionD: { required: true, message: '选项 D 不能为空' },
        correctOption: { required: true, message: '请选择正确答案' }
      })) {
        return;
      }
      var payload = {
        category: $.trim($form.find('[name=category]').val()),
        difficulty: $.trim($form.find('[name=difficulty]').val()),
        question: $.trim($form.find('[name=question]').val()),
        optionA: $.trim($form.find('[name=optionA]').val()),
        optionB: $.trim($form.find('[name=optionB]').val()),
        optionC: $.trim($form.find('[name=optionC]').val()),
        optionD: $.trim($form.find('[name=optionD]').val()),
        correctOption: $form.find('[name=correctOption]').val(),
        explanation: $.trim($form.find('[name=explanation]').val())
      };
      var $btn = $('#quiz-save');
      ZF.btnLoading($btn, true, '保存中…');
      var req = editingId
        ? ZF.put('/quiz/' + editingId, payload)
        : ZF.post('/quiz', payload);
      req.then(function () {
        ZF.toast(editingId ? '已更新' : '已新增', 'success');
        bootstrap.Modal.getInstance($('#quizModal')[0]).hide();
        $('#quiz-table').bootstrapTable('refresh');
      }).catch(function () { /* 统一提示 */ }).then(function () {
        ZF.btnLoading($btn, false);
      });
    });
  }

  /** 删除题目 */
  function removeQuiz(row) {
    ZF.confirm('确定删除该题目吗？此操作不可恢复。').then(function (ok) {
      if (!ok) { return; }
      ZF.del('/quiz/' + row.id).then(function () {
        ZF.toast('已删除', 'success');
        $('#quiz-table').bootstrapTable('refresh');
      }).catch(function () { /* 统一提示 */ });
    });
  }
})(jQuery, window.ZF);
</script>
</body>
</html>
