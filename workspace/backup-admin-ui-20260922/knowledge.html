<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 管理端为内部页面：禁用缓存，避免改动后仍加载到旧版本 -->
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
  <title>文章管理 - 职小法管理后台</title>
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-table/bootstrap-table.min.css">
  <link rel="stylesheet" href="../css/app.css?v=20260922e">
</head>
<body class="zf-admin-page">

<div class="zf-app">
  <main class="zf-main">
    <header class="zf-topbar"></header>

    <section class="zf-content">
      <div class="zf-card">
        <div class="zf-card__head">
          <div><h3 class="zf-card__title">普法文章管理</h3>
            <p class="zf-card__desc">发布与管理普法文章内容</p></div>
          <button class="zf-btn zf-btn--primary" id="add-btn"><i class="bi bi-plus-lg"></i>新增文章</button>
        </div>

        <div class="zf-toolbar">
          <span class="zf-toolbar__count" id="kb-count">共 0 篇文章</span>
          <span class="zf-toolbar__spacer"></span>
        </div>

        <div class="zf-filter-bar" id="kb-filter">
          <div class="zf-filter-bar__item">
            <label class="zf-filter-bar__label">关键词</label>
            <input class="zf-form-control" type="text" data-filter="keyword" placeholder="标题 / 作者 / 摘要 / 正文">
          </div>
          <div class="zf-filter-bar__item">
            <label class="zf-filter-bar__label">分类</label>
            <select class="zf-form-control" data-filter="category"></select>
          </div>
          <div class="zf-filter-bar__item">
            <label class="zf-filter-bar__label">状态</label>
            <select class="zf-form-control" data-filter="status">
              <option value="">全部</option>
              <option value="1">已发布</option>
              <option value="0">草稿</option>
            </select>
          </div>
          <div class="zf-filter-bar__actions">
            <button class="zf-btn zf-btn--primary" id="search-btn"><i class="bi bi-search"></i>查询</button>
            <button class="zf-btn zf-btn--ghost" id="reset-btn"><i class="bi bi-arrow-clockwise"></i>重置</button>
          </div>
        </div>

        <table id="kb-table" class="zf-table"></table>
      </div>
    </section>
  </main>
</div>

<!-- 文章编辑模态框 -->
<div class="modal fade" id="kbModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="kb-modal-title">新增文章</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="kb-form" novalidate>
        <div class="modal-body">
          <input type="hidden" name="id">
          <div class="zf-field">
            <label class="zf-form-label" for="k-title">标题 <span style="color:var(--zf-danger)">*</span></label>
            <input class="zf-form-control" type="text" name="title" id="k-title" maxlength="120">
            <div class="zf-form-error"></div>
          </div>
          <div class="zf-field">
            <label class="zf-form-label" for="k-summary">摘要</label>
            <textarea class="zf-form-control" name="summary" id="k-summary" rows="2" maxlength="200"></textarea>
          </div>
          <div class="zf-grid zf-grid--3">
            <div class="zf-field">
              <label class="zf-form-label" for="k-category">分类 <span style="color:var(--zf-danger)">*</span></label>
              <select class="zf-form-control" name="category" id="k-category"></select>
              <div class="zf-form-error"></div>
            </div>
            <div class="zf-field">
              <label class="zf-form-label" for="k-author">作者 <span style="color:var(--zf-danger)">*</span></label>
              <input class="zf-form-control" type="text" name="author" id="k-author" maxlength="30">
              <div class="zf-form-error"></div>
            </div>
            <div class="zf-field">
              <label class="zf-form-label" for="k-status">状态</label>
              <select class="zf-form-control" name="status" id="k-status">
                <option value="1">已发布</option>
                <option value="0">草稿</option>
              </select>
            </div>
          </div>
          <div class="zf-field">
            <label class="zf-form-label">标签</label>
            <div class="zf-tag-picker" id="k-tag-picker"></div>
            <div class="zf-form-hint">点击标签切换选中，可多选</div>
          </div>
          <div class="zf-field">
            <label class="zf-form-label" for="k-content">正文 <span style="color:var(--zf-danger)">*</span></label>
            <textarea class="zf-form-control" name="content" id="k-content" rows="10"></textarea>
            <div class="zf-form-error"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="zf-btn zf-btn--ghost" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="zf-btn zf-btn--primary" id="kb-save"><i class="bi bi-check2"></i>保存</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- 文章预览模态框 -->
<div class="modal fade" id="previewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">文章预览</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="preview-body"></div>
    </div>
  </div>
</div>

<script src="../vendor/jquery/jquery.min.js"></script>
<script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../vendor/bootstrap-table/bootstrap-table.min.js"></script>
<script src="../vendor/bootstrap-table/bootstrap-table-zh-CN.min.js"></script>
<script src="../js/common.js?v=20260922e"></script>
<script src="admin-common.js?v=20260922e"></script>
<script>
/**
 * @file knowledge.html —— 普法文章管理
 * @description 文章的列表、筛选、预览、新增、编辑、删除与发布状态维护。
 *              标签以查询串 ?tags=标签1,标签2 形式随请求发送；
 *              预览弹窗直接复用列表行数据（含 content），避免调用 /knowledge/{id}
 *              详情接口导致阅读量被累计。
 */
(function ($, ZF) {
  'use strict';

  /** 当前编辑行的 id（新增时为 null） */
  var editingId = null;

  /** 标签选择器状态：候选标签池 / 当前选中 */
  var tagOptions = [];
  var selectedTags = [];

  /**
   * 预设候选标签（职场法律场景常用），标签一律从这里选。
   *
   * 刻意不查库：早期版本从标签字典动态取，会把历史文章里不规范的自定义标签
   * （如用户手输的「1」）一起带进候选列表。
   */
  var TAG_PRESETS = [
    '试用期', '劳动合同', '违法辞退', '离职', '拖欠工资', '加班费',
    '工作时间', '竞业限制', '保密协议', '社保', '工伤', '年假',
    '女职工权益', '经济补偿', '二倍工资', '劳动仲裁', '证据'
  ];

  /** 文章分类（与法条库共用同一套职场分类；清单定义在 admin-common.js，便于各页统一） */
  var CATEGORIES = ZF.WORK_CATEGORIES;

  ZF.initAdminPage({ active: 'knowledge', title: '文章管理', sub: '普法文章内容与发布状态维护' })
    .then(function () {
      initCategorySelect();
      initTagPicker();
      bindTagPicker();
      initTable();
      bindFilters();
      bindAdd();
      bindKbForm();
    });

  /** 初始化分类下拉：筛选栏（含「全部分类」）+ 表单 */
  function initCategorySelect() {
    $('#kb-filter [data-filter="category"]').html(ZF.categoryOptions(CATEGORIES, '全部分类'));
    $('#k-category').html(ZF.categoryOptions(CATEGORIES));
  }

  /** 初始化标签选择器：候选来自预设清单 */
  function initTagPicker() {
    tagOptions = TAG_PRESETS.slice();
    renderTagPicker();
  }

  /** 渲染标签选择器（已选中的标签一定会出现，即使不在字典里） */
  function renderTagPicker() {
    var all = tagOptions.slice();
    selectedTags.forEach(function (t) {
      if (all.indexOf(t) < 0) {
        all.push(t);
      }
    });
    if (!all.length) {
      $('#k-tag-picker').html('<span class="zf-tag-picker__empty">暂无可用标签</span>');
      return;
    }
    $('#k-tag-picker').html(all.map(function (t) {
      var on = selectedTags.indexOf(t) >= 0;
      return '<span class="zf-tag-chip' + (on ? ' zf-tag-chip--on' : '') + '" data-tag="' + ZF.escape(t) + '">' +
        (on ? '<i class="bi bi-check2"></i>' : '') + ZF.escape(t) + '</span>';
    }).join(''));
  }

  /** 绑定标签点击切换 */
  function bindTagPicker() {
    $('#k-tag-picker').on('click', '.zf-tag-chip', function () {
      var t = $(this).attr('data-tag');
      var i = selectedTags.indexOf(t);
      if (i >= 0) {
        selectedTags.splice(i, 1);
      } else {
        selectedTags.push(t);
      }
      renderTagPicker();
    });
  }

  /** 把行数据里的标签（数组或逗号分隔串）统一解析成数组 */
  function parseTags(tags) {
    if (Array.isArray(tags)) {
      return tags.map(function (s) { return $.trim(s); }).filter(Boolean);
    }
    return splitTags(tags);
  }

  /**
   * 回填分类下拉。
   * 若当前值不在预设分类里（早期手输留下的脏数据，如「11」），
   * 临时补一个「历史值」选项，避免编辑保存时被静默改成第一个分类。
   */
  function setCategoryValue(value) {
    var v = $.trim(value || '');
    var $sel = $('#k-category');
    $sel.find('option[data-legacy]').remove();
    if (v && CATEGORIES.indexOf(v) < 0) {
      $sel.append('<option data-legacy="1" value="' + ZF.escape(v) + '">' +
        ZF.escape(v) + '（历史值）</option>');
    }
    $sel.val(v || CATEGORIES[0]);
  }

  /**
   * 把标签渲染为多个徽标（兼容字符串数组与逗号分隔字符串两种来源）。
   * @param {Array|string} tags 标签数据
   * @returns {string} 徽标 HTML，缺省时返回占位符
   */
  function tagBadges(tags) {
    var arr = [];
    if (Array.isArray(tags)) {
      arr = tags;
    } else if (typeof tags === 'string' && tags) {
      arr = tags.split(/[,，]/).map(function (s) { return $.trim(s); });
    }
    arr = arr.filter(Boolean);
    if (!arr.length) {
      return '<span style="color:var(--zf-ink-3)">-</span>';
    }
    return arr.map(function (t) {
      return '<span class="zf-badge">' + ZF.escape(t) + '</span>';
    }).join(' ');
  }

  /**
   * 构造详情网格单元（label 与 value 均做转义/安全处理）。
   * @param {string} label 标签名
   * @param {string} valueHtml 已处理好的安全 HTML 值
   * @returns {string} 单元 HTML
   */
  function detailItem(label, valueHtml) {
    return '<div class="zf-detail-grid__item">' +
      '<div class="zf-detail-grid__label">' + ZF.escape(label) + '</div>' +
      '<div class="zf-detail-grid__value">' + valueHtml + '</div></div>';
  }

  /**
   * 操作列：查看 / 编辑 / 删除。
   * @returns {string} 操作按钮组 HTML
   */
  function operateFormatter() {
    return [
      '<div class="zf-actions">',
      '<button class="zf-btn zf-btn--ghost zf-btn--sm js-view"><i class="bi bi-eye"></i>查看</button>',
      '<button class="zf-btn zf-btn--ghost zf-btn--sm js-edit"><i class="bi bi-pencil"></i>编辑</button>',
      '<button class="zf-btn zf-btn--danger zf-btn--sm js-delete"><i class="bi bi-trash"></i>删除</button>',
      '</div>'
    ].join('');
  }

  /** 初始化表格 */
  function initTable() {
    ZF.initAdminTable('#kb-table', '/knowledge', {
      pageSize: 10,
      // 初始排序：发布时间倒序（与后端默认一致，点列头可切换）
      sortName: 'publishedAt',
      sortOrder: 'desc',
      queryParams: function () {
        // 状态选「全部」时 data-filter="status" 值为空，filterParams 会自动剔除，
        // 从而不传 status 参数，确保草稿也能被管理员看到。
        return ZF.filterParams('#kb-filter');
      },
      columns: [
        { field: 'id', title: 'ID', width: 64, sortable: true },
        { field: 'title', title: '标题', formatter: function (v) { return ZF.escape(ZF.truncate(v, 36)); } },
        { field: 'category', title: '分类', formatter: function (v) {
            return v ? '<span class="zf-badge">' + ZF.escape(v) + '</span>' : '<span style="color:var(--zf-ink-3)">-</span>';
          } },
        { field: 'author', title: '作者', formatter: function (v) { return ZF.escape(ZF.orDash(v)); } },
        { field: 'viewCount', title: '阅读', sortable: true, formatter: function (v) { return ZF.escape(String(v || 0)); } },
        { field: 'likeCount', title: '点赞', sortable: true, formatter: function (v) { return ZF.escape(String(v || 0)); } },
        { field: 'status', title: '状态', formatter: function (v) { return ZF.publishBadge(v); } },
        { field: 'publishedAt', title: '发布时间', sortable: true, formatter: function (v) { return ZF.escape(ZF.dt(v)); } },
        { field: 'tags', title: '标签', formatter: tagBadges },
        { field: 'operate', title: '操作', formatter: operateFormatter, events: operateEvents }
      ]
    });

    // 列表加载成功后刷新顶部计数
    $('#kb-table').on('load-success.bs.table', function (e, data) {
      var total = (data && data.total) || 0;
      $('#kb-count').text('共 ' + total + ' 篇文章');
    });
  }

  /** 操作事件 */
  var operateEvents = {
    'click .js-view': function (e, v, row) { openPreview(row); },
    'click .js-edit': function (e, v, row) { openEdit(row); },
    'click .js-delete': function (e, v, row) { removeKb(row); }
  };

  /** 绑定筛选与重置 */
  function bindFilters() {
    $('#search-btn').on('click', function () { ZF.refreshTable('#kb-table'); });
    $('#reset-btn').on('click', function () {
      $('#kb-filter [data-filter]').val('');
      ZF.refreshTable('#kb-table');
    });
    $('#kb-filter [data-filter]').on('keydown', function (e) {
      if (e.key === 'Enter') { ZF.refreshTable('#kb-table'); }
    });
  }

  /** 打开新增 */
  function bindAdd() {
    $('#add-btn').on('click', function () {
      editingId = null;
      $('#kb-modal-title').text('新增文章');
      $('#kb-form')[0].reset();
      $('#kb-form').find('[name=id]').val('');
      $('#kb-form').find('[name=status]').val('1');
      // 清空标签选择
      selectedTags = [];
      renderTagPicker();
      ZF.clearValidate($('#kb-form'));
      bootstrap.Modal.getOrCreateInstance($('#kbModal')[0]).show();
    });
  }

  /** 打开预览（直接用列表行数据，避免累计阅读量） */
  function openPreview(row) {
    var meta = '<div class="zf-detail-grid">' +
      detailItem('分类', '<span class="zf-badge">' + ZF.escape(ZF.orDash(row.category)) + '</span>') +
      detailItem('作者', ZF.escape(ZF.orDash(row.author))) +
      detailItem('状态', ZF.publishBadge(row.status)) +
      detailItem('阅读量', ZF.escape(String(row.viewCount || 0))) +
      detailItem('点赞数', ZF.escape(String(row.likeCount || 0))) +
      detailItem('发布时间', ZF.escape(ZF.dt(row.publishedAt))) +
      '</div>';
    var tagsHtml = '<div class="zf-detail-full">' +
      '<div class="zf-detail-grid__label">标签</div>' + tagBadges(row.tags) + '</div>';
    var html = '<h4 class="zf-card__title">' + ZF.escape(row.title || '') + '</h4>' +
      meta +
      (row.summary ? '<div class="zf-quote">' + ZF.escape(row.summary) + '</div>' : '') +
      '<div class="zf-detail-grid__label">正文</div>' +
      '<div class="zf-doc">' + ZF.escape(row.content || '') + '</div>' +
      tagsHtml;
    $('#preview-body').html(html);
    bootstrap.Modal.getOrCreateInstance($('#previewModal')[0]).show();
  }

  /** 打开编辑并回填 */
  function openEdit(row) {
    editingId = row.id;
    $('#kb-modal-title').text('编辑文章');
    var $f = $('#kb-form');
    ZF.clearValidate($f);
    $f.find('[name=id]').val(row.id);
    $f.find('[name=title]').val(row.title || '');
    $f.find('[name=summary]').val(row.summary || '');
    setCategoryValue(row.category);
    $f.find('[name=author]').val(row.author || '');
    $f.find('[name=status]').val(row.status === 0 || row.status === '0' ? '0' : '1');
    // 标签：回填到选择器（不用 input）
    selectedTags = parseTags(row.tags);
    renderTagPicker();
    $f.find('[name=content]').val(row.content || '');
    bootstrap.Modal.getOrCreateInstance($('#kbModal')[0]).show();
  }

  /** 把逗号分隔标签拆分为数组（去空） */
  function splitTags(str) {
    return (str || '').split(/[,，]/).map(function (s) { return $.trim(s); }).filter(Boolean);
  }

  /** 保存（新增/编辑） */
  function bindKbForm() {
    $('#kb-form').on('submit', function (e) {
      e.preventDefault();
      var $form = $(this);
      ZF.clearValidate($form);
      if (!ZF.validate($form, {
        title: { required: true, message: '标题不能为空' },
        category: { required: true, message: '分类不能为空' },
        author: { required: true, message: '作者不能为空' },
        content: { required: true, message: '正文不能为空' }
      })) {
        return;
      }
      var tags = selectedTags.slice();
      var payload = {
        title: $.trim($form.find('[name=title]').val()),
        summary: $.trim($form.find('[name=summary]').val()),
        category: $.trim($form.find('[name=category]').val()),
        author: $.trim($form.find('[name=author]').val()),
        status: parseInt($form.find('[name=status]').val(), 10),
        content: $.trim($form.find('[name=content]').val())
      };
      // 标签通过查询串 ?tags=标签1,标签2 发送
      var tagParam = encodeURIComponent(tags.join(','));
      var $btn = $('#kb-save');
      ZF.btnLoading($btn, true, '保存中…');
      var req;
      if (editingId) {
        req = ZF.put('/knowledge/' + editingId + '?tags=' + tagParam, payload);
      } else {
        req = ZF.post('/knowledge?tags=' + tagParam, payload);
      }
      req.then(function () {
        ZF.toast(editingId ? '已更新' : '已发布', 'success');
        bootstrap.Modal.getOrCreateInstance($('#kbModal')[0]).hide();
        $('#kb-table').bootstrapTable('refresh');
      }).catch(function () { /* 统一提示 */ }).then(function () {
        ZF.btnLoading($btn, false);
      });
    });
  }

  /** 删除文章 */
  function removeKb(row) {
    ZF.confirm('确定删除文章「' + ZF.escape(row.title || '') + '」吗？此操作不可恢复。').then(function (ok) {
      if (!ok) { return; }
      ZF.del('/knowledge/' + row.id).then(function () {
        ZF.toast('已删除', 'success');
        $('#kb-table').bootstrapTable('refresh');
      }).catch(function () { /* 统一提示 */ });
    });
  }
})(jQuery, window.ZF);
</script>
</body>
</html>
