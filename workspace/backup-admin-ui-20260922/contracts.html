<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 管理端为内部页面：禁用缓存，避免改动后仍加载到旧版本 -->
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
  <title>合同管理 - 职小法管理后台</title>
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-table/bootstrap-table.min.css">
  <link rel="stylesheet" href="../css/app.css?v=20260922e">
</head>
<body class="zf-admin-page">

<div class="zf-app">
  <main class="zf-main">
    <header class="zf-topbar"></header>

    <section class="zf-content">
      <div class="zf-card">
        <div class="zf-card__head"><div><h3 class="zf-card__title">合同与风险点管理</h3>
          <p class="zf-card__desc">查看合同审查记录与逐条风险点明细</p></div></div>

        <!-- 筛选条：关键词 / 风险等级 / 状态 + 查询重置 -->
        <div class="zf-filter-bar" id="contract-filter">
          <div class="zf-filter-bar__item">
            <label class="zf-filter-bar__label" for="f-keyword">关键词</label>
            <input class="zf-form-control" type="text" id="f-keyword" data-filter="keyword" placeholder="文件名 / 甲方 / 乙方">
          </div>
          <div class="zf-filter-bar__item">
            <label class="zf-filter-bar__label" for="f-risk">风险等级</label>
            <select class="zf-form-control" id="f-risk" data-filter="riskLevel">
              <option value="">全部风险等级</option>
              <option value="高">高</option>
              <option value="中">中</option>
              <option value="低">低</option>
            </select>
          </div>
          <div class="zf-filter-bar__item">
            <label class="zf-filter-bar__label" for="f-status">状态</label>
            <select class="zf-form-control" id="f-status" data-filter="status">
              <option value="">全部状态</option>
              <option value="0">待审查</option>
              <option value="1">已审查</option>
            </select>
          </div>
          <div class="zf-filter-bar__actions">
            <button class="zf-btn zf-btn--primary" id="search-btn"><i class="bi bi-search"></i>查询</button>
            <button class="zf-btn zf-btn--ghost" id="reset-btn"><i class="bi bi-arrow-clockwise"></i>重置</button>
          </div>
        </div>

        <!-- 顶部计数 -->
        <div class="zf-toolbar">
          <span class="zf-toolbar__count" id="contract-count">共 0 份合同</span>
        </div>

        <table id="contract-table" class="zf-table"></table>
      </div>
    </section>
  </main>
</div>

<!-- 合同详情模态框（重点：基本信息 + 逐条风险点明细） -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">合同风险明细</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detail-body"><div class="zf-loading">加载中…</div></div>
      <div class="modal-footer">
        <button type="button" class="zf-btn zf-btn--ghost" data-bs-dismiss="modal">关闭</button>
      </div>
    </div>
  </div>
</div>

<script src="../vendor/jquery/jquery.min.js"></script>
<script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../vendor/bootstrap-table/bootstrap-table.min.js"></script>
<script src="../vendor/bootstrap-table/bootstrap-table-zh-CN.min.js"></script>
<script src="../js/common.js?v=20260922e"></script>
<script src="admin-common.js?v=20260922e"></script>
<script>
/**
 * @file contracts.html —— 合同与风险点管理
 * @description 分页展示合同审查记录，支持关键词 / 风险等级 / 状态筛选；
 *              查看详情（基本信息 + 逐条风险点明细），删除记录。
 *              本页仅含管理动作，不提供用户端「上传合同」等入口。
 */
(function ($, ZF) {
  'use strict';

  /** 当前操作行 */
  var current = null;

  ZF.initAdminPage({ active: 'contracts', title: '合同管理', sub: '合同审查与风险点明细' })
    .then(function () {
      initTable();
      bindFilters();
    });

  /** 详情网格的一项（标签 + 值，值已转义） */
  function detailItem(label, value) {
    return '<div class="zf-detail-grid__item">' +
      '<span class="zf-detail-grid__label">' + ZF.escape(label) + '</span>' +
      '<span class="zf-detail-grid__value">' + value + '</span></div>';
  }

  /** 操作列：查看风险明细 / 删除（不换行） */
  function operateFormatter() {
    return '<div class="zf-actions">' +
      '<button class="zf-btn zf-btn--ghost zf-btn--sm js-detail"><i class="bi bi-shield-exclamation"></i>风险明细</button>' +
      '<button class="zf-btn zf-btn--danger zf-btn--sm js-delete"><i class="bi bi-trash"></i>删除</button>' +
      '</div>';
  }

  /** 操作事件 */
  var operateEvents = {
    'click .js-detail': function (e, v, row) { openDetail(row); },
    'click .js-delete': function (e, v, row) { removeContract(row); }
  };

  /** 初始化表格 */
  function initTable() {
    ZF.initAdminTable('#contract-table', '/contracts', {
      pageSize: 10,
      // 初始排序：id 倒序（与后端默认一致，点列头可切换）
      sortName: 'id',
      sortOrder: 'desc',
      queryParams: function () { return ZF.filterParams('#contract-filter'); },
      columns: [
        { field: 'id', title: 'ID', width: 64, sortable: true },
        { field: 'userNickname', title: '上传人', formatter: function (v) { return ZF.escape(v || '匿名'); } },
        { field: 'fileName', title: '合同文件名', formatter: function (v) { return ZF.escape(ZF.truncate(v, 30)); } },
        { field: 'contractType', title: '合同类型', formatter: function (v) { return v ? ZF.escape(v) : '-'; } },
        { field: 'party', title: '甲方 / 乙方', formatter: function (v, row) {
            return ZF.escape(ZF.truncate(row.partyA || '-', 14)) + ' / ' + ZF.escape(ZF.truncate(row.partyB || '-', 14));
          } },
        { field: 'signDate', title: '签订日期', formatter: function (v) { return ZF.escape(v || '-'); } },
        { field: 'riskLevel', title: '整体风险', sortable: true, formatter: function (v) { return ZF.riskBadge(v); } },
        { field: 'riskCount', title: '风险点', sortable: true, formatter: function (v) { return ZF.escape(String(v || 0)); } },
        { field: 'createdAt', title: '上传时间', sortable: true, formatter: ZF.dt },
        { field: 'operate', title: '操作', formatter: operateFormatter, events: operateEvents }
      ]
    });
    // 加载成功后用后端返回的总数刷新顶部计数
    $('#contract-table').on('load-success.bs.table', function (e, data) {
      $('#contract-count').text('共 ' + ((data && data.total) || 0) + ' 份合同');
    });
  }

  /** 绑定筛选（查询 / 重置 / 回车） */
  function bindFilters() {
    $('#search-btn').on('click', function () { ZF.refreshTable('#contract-table'); });
    $('#reset-btn').on('click', function () {
      $('#contract-filter').find('[data-filter]').val('');
      ZF.refreshTable('#contract-table');
    });
    $('#contract-filter').on('keydown', 'input', function (e) {
      if (e.key === 'Enter') { ZF.refreshTable('#contract-table'); }
    });
  }

  /** 打开详情：基本信息 + 逐条风险点（后端已按 高→中→低 排序） */
  function openDetail(row) {
    current = row;
    var $body = $('#detail-body');
    ZF.renderLoading($body, '加载详情…');
    bootstrap.Modal.getOrCreateInstance($('#detailModal')[0]).show();
    ZF.get('/contracts/' + row.id).then(function (d) {
      d = d || row;
      // 1) 顶部基本信息网格
      var html = '<div class="zf-detail-grid">';
      html += detailItem('上传人', ZF.escape(d.userNickname || '匿名'));
      html += detailItem('合同文件名', ZF.escape(d.fileName || '-'));
      html += detailItem('合同类型', ZF.escape(d.contractType || '-'));
      html += detailItem('甲方', ZF.escape(d.partyA || '-'));
      html += detailItem('乙方', ZF.escape(d.partyB || '-'));
      html += detailItem('签订日期', ZF.escape(d.signDate || '-'));
      html += detailItem('整体风险等级', ZF.riskBadge(d.riskLevel));
      html += detailItem('风险点数量', ZF.escape(String(d.riskCount || 0)));
      html += detailItem('上传时间', ZF.dt(d.createdAt));
      html += '</div>';

      // 2) 逐条风险点
      var risks = d.risks || [];
      html += '<p class="zf-subtitle" style="margin-top:18px">风险点明细（' + risks.length + '）</p>';
      html += '<div id="risk-wrap"></div>';
      $body.html(html);

      var $wrap = $('#risk-wrap');
      if (!risks.length) {
        ZF.renderEmpty($wrap, '该合同未发现风险点');
        return;
      }

      var list = '';
      risks.forEach(function (r, i) {
        list += '<div class="zf-court-panel" style="margin-bottom:14px">';
        // 头部：风险等级徽标 + 条款编号 + 序号
        list += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">';
        list += ZF.riskBadge(r.riskLevel);
        if (r.clauseNo) { list += ' <span class="zf-risk__clause">条款 ' + ZF.escape(r.clauseNo) + '</span>'; }
        list += ' <span class="zf-risk__clause">#' + (i + 1) + '</span>';
        list += '</div>';
        // 问题条款原文（灰底引用块）
        if (r.clauseContent) {
          list += '<div class="zf-quote">' + ZF.escape(r.clauseContent) + '</div>';
        }
        // 风险说明
        list += '<p class="zf-risk__desc"><b>风险说明：</b>' + ZF.escape(r.riskDesc || '-') + '</p>';
        // 修改建议
        list += '<p class="zf-risk__sug"><b>修改建议：</b>' + ZF.escape(r.suggestion || '-') + '</p>';
        // 关联法条
        if (r.lawName) {
          list += '<p class="zf-risk__law"><i class="bi bi-book"></i> ' + ZF.escape(r.lawName) +
            (r.lawArticleNo ? ' ' + ZF.escape(r.lawArticleNo) : '') + '</p>';
        }
        list += '</div>';
      });
      $wrap.html(list);
    }).catch(function () {
      ZF.renderEmpty($body, '详情加载失败');
    });
  }

  /** 删除合同（先二次确认） */
  function removeContract(row) {
    ZF.confirm('确定删除该合同审查记录吗？相关风险点也会一并删除。').then(function (ok) {
      if (!ok) { return; }
      ZF.del('/contracts/' + row.id).then(function () {
        ZF.toast('已删除', 'success');
        $('#contract-table').bootstrapTable('refresh');
      }).catch(function () { /* 统一提示 */ });
    });
  }
})(jQuery, window.ZF);
</script>
</body>
</html>
