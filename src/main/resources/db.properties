# ============================================================================
#  数据库连接配置（classpath 默认值）
#  ---------------------------------------------------------------------------
#  本文件随仓库公开，所以**只放占位值**。真实的账号密码写到：
#      <项目根>/config/db.properties
#  该文件已在 .gitignore 中忽略，启动时会覆盖本文件的同名键；
#  模板见 config/db.properties.example。
#
#  也可以用 JVM 参数临时覆盖（优先级最高，便于同一个 WAR 切换开发库/测试库）：
#      -Djdbc.url=... -Djdbc.username=... -Djdbc.password=...
#
#  改本文件需要重新打包，改 config/db.properties 只需重启应用。
# ============================================================================

# ---------- JDBC 基本参数 ----------
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://127.0.0.1:3306/zhixiaofa?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
jdbc.username=root
# 留空表示无密码；本地开发的实际密码请写进 config/db.properties
jdbc.password=

# ---------- 连接池参数 ----------
# 最小空闲连接：应用启动时预热
pool.minIdle=2
# 最大连接数：JMeter 100 并发压测时按需自动扩容
pool.maxTotal=20
# 获取连接的最长等待时间（毫秒）
pool.maxWaitMillis=5000
# 空闲连接超过该时间（毫秒）且当前连接数大于 minIdle 时回收
pool.maxIdleMillis=300000
# 连接可用性检查语句
pool.validationQuery=SELECT 1

# ---------- 业务参数 ----------
# 分页默认每页条数
page.defaultSize=10
# 分页最大每页条数（防止恶意传参）
page.maxSize=100
