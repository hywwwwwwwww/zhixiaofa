# ============================================================================
#  数据库连接参数（课程要求：连接池配置需可参数化）
#  修改本文件即可切换数据库，无需改动任何 Java 代码
# ============================================================================

# ---------- JDBC 基本参数 ----------
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://127.0.0.1:3306/zhixiaofa?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
jdbc.username=root
jdbc.password=root

# ---------- 连接池参数 ----------
# 最小空闲连接，应用启动时预热
pool.minIdle=2
# 最大连接数（JMeter 100 并发压测时按机器情况调整）
pool.maxTotal=20
# 获取连接的最长等待时间(毫秒)
pool.maxWaitMillis=5000
# 空闲连接超过该时间(毫秒)且当前连接数大于 minIdle 时回收
pool.maxIdleMillis=300000
# 连接有效性检测语句
pool.validationQuery=SELECT 1

# ---------- 业务参数 ----------
# 分页默认每页条数
page.defaultSize=10
# 分页最大每页条数（防止恶意传参）
page.maxSize=100
