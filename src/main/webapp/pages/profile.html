<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 职小法</title>
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>

<div class="zf-app">
  <main class="zf-main">
    <header class="zf-topbar"></header>

    <section class="zf-content">
      <!-- 个人信息卡 -->
      <div class="zf-card" style="margin-bottom:16px">
        <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
          <div style="width:72px;height:72px;flex:0 0 72px;border-radius:50%;background:var(--zf-primary-light);
            display:grid;place-items:center;font-size:44px;color:var(--zf-primary-ink)">
            <i class="bi bi-person-circle"></i>
          </div>
          <div style="flex:1;min-width:200px">
            <div style="display:flex;align-items:center;gap:10px">
              <h3 class="zf-card__title" id="p-nickname" style="margin:0;font-size:18px"></h3>
              <span class="zf-badge zf-badge--primary" id="p-role"></span>
            </div>
            <p class="zf-card__desc" style="margin-top:4px">
              用户名：<span id="p-username"></span> ｜ 注册于 <span id="p-created"></span>
            </p>
          </div>
        </div>
        <!-- 数量统计 -->
        <div class="zf-grid zf-grid--4" style="margin-top:16px" id="stat-grid">
          <div class="zf-stat"><div class="zf-stat__icon"><i class="bi bi-chat-square-text"></i></div>
            <div><p class="zf-stat__label">我的问答</p><p class="zf-stat__value" data-stat="qa">-</p></div></div>
          <div class="zf-stat"><div class="zf-stat__icon"><i class="bi bi-file-earmark-check"></i></div>
            <div><p class="zf-stat__label">审查合同</p><p class="zf-stat__value" data-stat="contract">-</p></div></div>
          <div class="zf-stat"><div class="zf-stat__icon"><i class="bi bi-pencil-square"></i></div>
            <div><p class="zf-stat__label">生成文书</p><p class="zf-stat__value" data-stat="doc">-</p></div></div>
          <div class="zf-stat"><div class="zf-stat__icon"><i class="bi bi-star"></i></div>
            <div><p class="zf-stat__label">我的收藏</p><p class="zf-stat__value" data-stat="favorite">-</p></div></div>
        </div>
      </div>

      <div class="zf-grid zf-grid--2" style="align-items:start">
        <!-- 资料设置 -->
        <div class="zf-card">
          <div class="zf-card__head"><div><h3 class="zf-card__title">资料设置</h3>
            <p class="zf-card__desc">修改你的基本资料</p></div></div>
          <form id="profile-form" novalidate>
            <div class="zf-field">
              <label class="zf-form-label" for="pf-nickname">昵称 <span style="color:var(--zf-danger)">*</span></label>
              <input class="zf-form-control" type="text" name="nickname" id="pf-nickname" maxlength="30">
              <div class="zf-form-error"></div>
            </div>
            <div class="zf-field">
              <label class="zf-form-label" for="pf-email">邮箱</label>
              <input class="zf-form-control" type="text" name="email" id="pf-email" maxlength="60">
              <div class="zf-form-error"></div>
            </div>
            <div class="zf-field">
              <label class="zf-form-label" for="pf-phone">手机号</label>
              <input class="zf-form-control" type="text" name="phone" id="pf-phone" maxlength="20">
              <div class="zf-form-error"></div>
            </div>
            <div class="zf-grid zf-grid--2">
              <div class="zf-field">
                <label class="zf-form-label" for="pf-city">城市</label>
                <input class="zf-form-control" type="text" name="city" id="pf-city" maxlength="30">
              </div>
              <div class="zf-field">
                <label class="zf-form-label" for="pf-job">岗位</label>
                <input class="zf-form-control" type="text" name="jobTitle" id="pf-job" maxlength="30">
              </div>
            </div>
            <div style="text-align:right">
              <button type="submit" class="zf-btn zf-btn--primary" id="pf-save">
                <i class="bi bi-check2"></i>保存资料
              </button>
            </div>
          </form>
        </div>

        <!-- 修改密码 -->
        <div class="zf-card">
          <div class="zf-card__head"><div><h3 class="zf-card__title">修改密码</h3>
            <p class="zf-card__desc">修改后需重新登录</p></div></div>
          <form id="pwd-form" novalidate>
            <div class="zf-field">
              <label class="zf-form-label" for="pw-old">原密码 <span style="color:var(--zf-danger)">*</span></label>
              <input class="zf-form-control" type="password" name="oldPassword" id="pw-old">
              <div class="zf-form-error"></div>
            </div>
            <div class="zf-field">
              <label class="zf-form-label" for="pw-new">新密码 <span style="color:var(--zf-danger)">*</span></label>
              <input class="zf-form-control" type="password" name="newPassword" id="pw-new">
              <div class="zf-form-error"></div>
              <div class="zf-form-hint">至少 6 位</div>
            </div>
            <div class="zf-field">
              <label class="zf-form-label" for="pw-confirm">确认新密码 <span style="color:var(--zf-danger)">*</span></label>
              <input class="zf-form-control" type="password" name="confirm" id="pw-confirm">
              <div class="zf-form-error"></div>
            </div>
            <div style="text-align:right">
              <button type="submit" class="zf-btn zf-btn--primary" id="pw-save">
                <i class="bi bi-shield-lock"></i>更新密码
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- 我的收藏 -->
      <div class="zf-card" style="margin-top:16px">
        <div class="zf-card__head"><div><h3 class="zf-card__title">我的收藏</h3>
          <p class="zf-card__desc">按类型查看，可取消收藏</p></div></div>
        <div id="fav-tabs" class="zf-form-hint" style="margin-bottom:12px"></div>
        <div id="fav-list"></div>
        <div id="fav-pager"></div>
      </div>
    </section>
  </main>
</div>

<script src="../vendor/jquery/jquery.min.js"></script>
<script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../js/common.js"></script>
<script>
/**
 * @file profile.html —— 个人中心
 * @description 展示个人信息与数量统计；资料设置、修改密码；按类型分页查看并管理我的收藏。
 */
(function ($, ZF) {
  'use strict';

  /** 当前收藏分页页码 */
  var favPage = 1;
  /** 当前收藏类型 */
  var favType = 'QA';
  /** 收藏类型 → 中文标签 */
  var FAV_LABEL = { QA: '问答', ARTICLE: '文章', LAW: '法条', DOC: '文书' };

  ZF.initPage({ active: 'profile', title: '个人中心', sub: '管理你的资料与收藏' })
    .then(function (user) {
      renderProfile(user);
      prefillForm(user);
      loadStats();
      bindProfileForm(user);
      bindPwdForm();
      renderFavTabs();
      loadFavorites('QA', 1);
    });

  /** 渲染个人信息卡 */
  function renderProfile(user) {
    $('#p-nickname').text(user.nickname || user.username);
    $('#p-username').text(user.username || '');
    $('#p-role').text(user.role === 'ADMIN' ? '管理员' : '普通用户');
    $('#p-created').text(ZF.formatDate(user.createdAt, false) || '-');
  }

  /** 把用户资料回填到表单 */
  function prefillForm(user) {
    $('#pf-nickname').val(user.nickname || '');
    $('#pf-email').val(user.email || '');
    $('#pf-phone').val(user.phone || '');
    $('#pf-city').val(user.city || '');
    $('#pf-job').val(user.jobTitle || '');
  }

  /** 拉取各模块数量统计 */
  function loadStats() {
    var tasks = [
      ZF.get('/qa/mine', { pageNum: 1, pageSize: 1 }, { silent: true }),
      ZF.get('/contracts/mine', { pageNum: 1, pageSize: 1 }, { silent: true }),
      ZF.get('/doc-records/mine', { pageNum: 1, pageSize: 1 }, { silent: true })
    ];
    Promise.all(tasks).then(function (res) {
      $('[data-stat=qa]').text(res[0].total);
      $('[data-stat=contract]').text(res[1].total);
      $('[data-stat=doc]').text(res[2].total);
      // 收藏总数：四类累加
      var favTotal = 0;
      ['QA', 'ARTICLE', 'LAW', 'DOC'].forEach(function (t) {
        ZF.get('/favorites', { targetType: t, pageNum: 1, pageSize: 1 }, { silent: true })
          .then(function (r) {
            favTotal += r.total;
            $('[data-stat=favorite]').text(favTotal);
          }).catch(function () { /* 忽略 */ });
      });
    }).catch(function () {
      $('#stat-grid .zf-stat__value').text('0');
    });
  }

  /** 绑定资料保存 */
  function bindProfileForm(user) {
    $('#profile-form').on('submit', function (e) {
      e.preventDefault();
      var $form = $(this);
      ZF.clearValidate($form);
      if (!ZF.validate($form, {
        nickname: { required: true, message: '昵称不能为空' },
        email: { pattern: /^[^\s@]+@[^\s@]+\.[^\s@]+$/, message: '邮箱格式不正确' }
      })) {
        return;
      }
      var $btn = $('#pf-save');
      ZF.btnLoading($btn, true, '保存中…');
      var payload = {
        nickname: $.trim($form.find('[name=nickname]').val()),
        email: $.trim($form.find('[name=email]').val()),
        phone: $.trim($form.find('[name=phone]').val()),
        city: $.trim($form.find('[name=city]').val()),
        jobTitle: $.trim($form.find('[name=jobTitle]').val()),
        avatar: user.avatar || ''
      };
      ZF.put('/auth/profile', payload).then(function () {
        ZF.clearUserCache();   // 清除缓存，后续取最新资料
        ZF.toast('资料已保存', 'success');
        // 刷新顶栏与信息卡
        ZF.currentUser().then(function (u) {
          if (u) {
            renderProfile(u);
            // 同步刷新顶部栏昵称
            $('.zf-topbar__user span').first().text(u.nickname || u.username);
          }
        });
      }).catch(function () { /* 统一提示 */ }).then(function () {
        ZF.btnLoading($btn, false);
      });
    });
  }

  /** 绑定修改密码 */
  function bindPwdForm() {
    $('#pwd-form').on('submit', function (e) {
      e.preventDefault();
      var $form = $(this);
      ZF.clearValidate($form);
      var pwd = $form.find('[name=newPassword]').val();
      var confirm = $form.find('[name=confirm]').val();
      if (!ZF.validate($form, {
        oldPassword: { required: true, message: '请输入原密码' },
        newPassword: { required: true, min: 6, message: '新密码至少 6 位' }
      })) {
        return;
      }
      if (pwd !== confirm) {
        $form.find('[name=confirm]').closest('.zf-field').addClass('zf-field--invalid')
          .find('.zf-form-error').text('两次输入的密码不一致');
        return;
      }
      var $btn = $('#pw-save');
      ZF.btnLoading($btn, true, '更新中…');
      ZF.put('/auth/password', {
        oldPassword: $form.find('[name=oldPassword]').val(),
        newPassword: pwd
      }).then(function () {
        ZF.toast('密码修改成功，请重新登录', 'success');
        // 后端会强制登出，延迟跳转到登录页
        setTimeout(function () { window.location.href = ZF.CTX + '/login.html'; }, 1300);
      }).catch(function () { /* 统一提示 */ }).then(function () {
        ZF.btnLoading($btn, false);
      });
    });
  }

  /** 渲染收藏类型标签页 */
  function renderFavTabs() {
    var html = Object.keys(FAV_LABEL).map(function (t) {
      return '<button class="zf-btn zf-btn--sm ' + (t === favType ? 'zf-btn--primary' : 'zf-btn--ghost') +
        ' js-fav-tab" data-type="' + t + '">' + FAV_LABEL[t] + '</button>';
    }).join(' ');
    $('#fav-tabs').html(html);
    $('#fav-tabs').off('click.zffav').on('click.zffav', '.js-fav-tab', function () {
      favType = $(this).data('type');
      renderFavTabs();
      loadFavorites(favType, 1);
    });
  }

  /**
   * 加载我的收藏分页列表。
   * @param {string} targetType 收藏类型 QA/ARTICLE/LAW/DOC
   * @param {number} pageNum 页码
   */
  function loadFavorites(targetType, pageNum) {
    favPage = pageNum || 1;
    var $box = $('#fav-list');
    ZF.renderLoading($box, '加载收藏…');
    ZF.get('/favorites', { targetType: targetType, pageNum: favPage, pageSize: 8 }).then(function (page) {
      if (!page.list || !page.list.length) {
        ZF.renderEmpty($box, '还没有收藏' + FAV_LABEL[targetType] + '，去对应模块收藏吧');
        $('#fav-pager').empty();
        return;
      }
      var html = ['<div class="zf-list">'];
      page.list.forEach(function (item) {
        html.push('<div class="zf-list__item" data-id="' + item.id + '" data-tid="' + item.targetId + '">');
        html.push('<div class="zf-list__main">');
        html.push('<p class="zf-list__title">' + ZF.escape(item.targetTitle || '未命名') + '</p>');
        if (item.targetSummary) {
          html.push('<p class="zf-list__text">' + ZF.escape(ZF.truncate(item.targetSummary, 60)) + '</p>');
        }
        html.push('</div>');
        html.push('<div class="zf-list__meta" style="text-align:right">');
        html.push(ZF.escape(ZF.formatDate(item.createdAt, false)) + '<br>');
        html.push('<button class="zf-btn zf-btn--ghost zf-btn--sm js-fav-cancel" data-type="' + item.targetType +
          '" data-tid="' + item.targetId + '"><i class="bi bi-x-circle"></i>取消收藏</button>');
        html.push('</div></div>');
      });
      html.push('</div>');
      $box.html(html.join(''));
      ZF.renderPager('#fav-pager', page, function (p) { loadFavorites(targetType, p); });
    }).catch(function () {
      ZF.renderEmpty($box, '加载失败，请刷新重试');
    });
  }

  /** 取消收藏事件委托 */
  $(document).on('click', '.js-fav-cancel', function () {
    var $btn = $(this);
    var type = $btn.data('type');
    var tid = $btn.data('tid');
    ZF.confirm('确定取消收藏吗？').then(function (ok) {
      if (!ok) { return; }
      ZF.post('/favorites/toggle', { targetType: type, targetId: tid }).then(function (faved) {
        if (!faved) {
          ZF.toast('已取消收藏', 'info');
          loadFavorites(favType, favPage);
          loadStats();
        }
      }).catch(function () { /* 统一提示 */ });
    });
  });
})(jQuery, window.ZF);
</script>
</body>
</html>
