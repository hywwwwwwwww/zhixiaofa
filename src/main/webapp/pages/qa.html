<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能法律问答 - 职小法</title>
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>

<div class="zf-app">
  <main class="zf-main">
    <header class="zf-topbar"></header>

    <section class="zf-content">
      <!-- 提问区 -->
      <div class="zf-card" style="margin-bottom:16px">
        <div class="zf-card__head">
          <div>
            <h3 class="zf-card__title">向职小法提问</h3>
            <p class="zf-card__desc">用大白话描述你的职场困惑，系统将检索法规库给出结构化建议并附上引用法条</p>
          </div>
        </div>
        <form id="qa-form" novalidate>
          <div class="zf-grid zf-grid--2">
            <div class="zf-field">
              <label class="zf-form-label" for="qa-category">问题分类（可选）</label>
              <select class="zf-form-control" name="category" id="qa-category">
                <option value="">不选（由系统自动判断）</option>
                <option value="劳动合同">劳动合同</option>
                <option value="工资报酬">工资报酬</option>
                <option value="工时休假">工时休假</option>
                <option value="社会保险">社会保险</option>
                <option value="解除终止">解除终止</option>
                <option value="竞业限制">竞业限制</option>
                <option value="其他">其他</option>
              </select>
            </div>
          </div>
          <div class="zf-field">
            <label class="zf-form-label" for="qa-question">你的问题 <span style="color:var(--zf-danger)">*</span></label>
            <textarea class="zf-form-control" name="question" id="qa-question" rows="4"
              placeholder="例如：公司试用期三个月不交社保，还说转正后才给交，这合法吗？"></textarea>
            <div class="zf-form-error"></div>
            <div class="zf-form-hint">请尽量描述清楚时间、人物、经过，问题字数 4~1000 字</div>
          </div>
          <div style="text-align:right">
            <button type="submit" class="zf-btn zf-btn--primary" id="qa-submit">
              <i class="bi bi-send"></i>提交咨询
            </button>
          </div>
        </form>
      </div>

      <!-- 咨询结果 -->
      <div class="zf-card" id="result-card" style="margin-bottom:16px; display:none">
        <div class="zf-card__head">
          <div><h3 class="zf-card__title">咨询结果</h3>
            <p class="zf-card__desc">以下回答由系统依据法规库生成，仅供参考</p></div>
          <button class="zf-btn zf-btn--ghost zf-btn--sm" id="result-close">
            <i class="bi bi-x-lg"></i>收起
          </button>
        </div>
        <div id="result-body"></div>
      </div>

      <!-- 历史咨询 -->
      <div class="zf-card">
        <div class="zf-card__head">
          <div>
            <h3 class="zf-card__title">历史咨询</h3>
            <p class="zf-card__desc">点击任意一条可展开查看完整回答与引用法条</p>
          </div>
          <button class="zf-btn zf-btn--ghost zf-btn--sm" id="history-refresh">
            <i class="bi bi-arrow-clockwise"></i>刷新
          </button>
        </div>
        <div id="history-list"></div>
        <div id="history-pager"></div>
      </div>
    </section>
  </main>
</div>

<script src="../vendor/jquery/jquery.min.js"></script>
<script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../js/common.js"></script>
<script>
/**
 * @file qa.html —— 智能法律问答
 * @description 提交咨询并渲染对话气泡 + 法条引用；下方分页展示历史咨询，支持展开、点赞、删除。
 */
(function ($, ZF) {
  'use strict';

  /** 当前历史分页页码 */
  var currentPage = 1;

  ZF.initPage({ active: 'qa', title: '智能法律问答', sub: '基于法规库的职场法律问题解答' })
    .then(function () {
      bindForm();
      bindResultClose();
      bindHistoryEvents();
      loadHistory(1);
    });

  /** 绑定提问表单提交 */
  function bindForm() {
    $('#qa-form').on('submit', function (e) {
      e.preventDefault();
      var $form = $(this);
      ZF.clearValidate($form);
      // 校验：问题必填，长度 4~1000
      if (!ZF.validate($form, {
        question: { required: true, min: 4, max: 1000, message: '请填写 4~1000 字的问题' }
      })) {
        return;
      }
      var $btn = $('#qa-submit');
      ZF.btnLoading($btn, true, '分析中…');
      var payload = {
        question: $.trim($form.find('[name=question]').val()),
        category: $form.find('[name=category]').val() || ''
      };
      ZF.post('/qa', payload).then(function (qa) {
        showResult(qa);
        $form[0].reset();
        // 新咨询插到历史最前，回到第一页
        loadHistory(1);
        ZF.toast('已生成回答', 'success');
      }).catch(function () {
        // 错误提示已由 ZF.request 统一弹出
      }).then(function () {
        ZF.btnLoading($btn, false);
      });
    });
  }

  /** 收起结果卡 */
  function bindResultClose() {
    $('#result-close').on('click', function () {
      $('#result-card').hide();
    });
  }

  /**
   * 把一条问答渲染成「问题气泡 + 回答气泡 + 法条引用」HTML。
   * @param {Object} qa 问答对象（含 question/answer/references）
   * @returns {string} HTML 片段
   */
  function renderAnswerHtml(qa) {
    var html = ['<div class="zf-bubble zf-bubble--q">' + ZF.escape(qa.question) + '</div>'];
    html.push('<div class="zf-bubble zf-bubble--a">' + ZF.nl2br(qa.answer) + '</div>');
    var refs = qa.references || [];
    if (refs.length) {
      html.push('<p class="zf-subtitle" style="margin-top:10px">引用法条（' + refs.length + '）</p>');
      refs.forEach(function (law) {
        html.push('<div class="zf-law">');
        html.push('<div class="zf-law__name">《' + ZF.escape(law.lawName) + '》' + ZF.escape(law.articleNo || '') + '</div>');
        if (law.title) {
          html.push('<div class="zf-law__text"><strong>' + ZF.escape(law.title) + '</strong></div>');
        }
        html.push('<div class="zf-law__text">' + ZF.escape(law.content) + '</div>');
        html.push('</div>');
      });
    }
    return html.join('');
  }

  /** 把最新一次回答渲染到结果卡并滚动可见 */
  function showResult(qa) {
    $('#result-body').html(renderAnswerHtml(qa));
    $('#result-card').show();
    $('#result-card')[0].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /** 历史列表相关事件委托 */
  function bindHistoryEvents() {
    // 点击标题展开/收起详情
    $('#history-list').on('click', '.zf-list__title', function () {
      $(this).closest('.zf-list__item').find('.zf-qa-detail').toggle();
    });
    // 点赞
    $('#history-list').on('click', '.js-like', function () {
      var $btn = $(this);
      var id = $btn.data('id');
      ZF.post('/qa/' + id + '/like', {}, { silent: true }).then(function () {
        var n = (parseInt($btn.data('count'), 10) || 0) + 1;
        $btn.data('count', n).find('.js-like-count').text(n);
        $btn.prop('disabled', true);
        ZF.toast('已点赞', 'success');
      }).catch(function () { /* 忽略 */ });
    });
    // 删除
    $('#history-list').on('click', '.js-del', function () {
      var $btn = $(this);
      var id = $btn.data('id');
      ZF.confirm('确定删除这条咨询记录吗？删除后无法恢复。').then(function (ok) {
        if (!ok) { return; }
        ZF.del('/qa/' + id).then(function () {
          ZF.toast('已删除', 'success');
          loadHistory(currentPage);
        }).catch(function () { /* 忽略 */ });
      });
    });
    $('#history-refresh').on('click', function () { loadHistory(1); });
  }

  /**
   * 加载历史咨询分页列表。
   * @param {number} pageNum 页码
   */
  function loadHistory(pageNum) {
    currentPage = pageNum || 1;
    var $box = $('#history-list');
    ZF.renderLoading($box, '加载历史咨询…');
    ZF.get('/qa/mine', { pageNum: currentPage, pageSize: 8 }).then(function (page) {
      if (!page.list || !page.list.length) {
        ZF.renderEmpty($box, '还没有咨询记录，去问一个问题试试');
        $('#history-pager').empty();
        return;
      }
      var html = ['<div class="zf-list">'];
      page.list.forEach(function (item) {
        var cat = item.category || '未分类';
        var refs = (item.references || []).length;
        html.push('<div class="zf-list__item" data-id="' + item.id + '">');
        html.push('<div class="zf-list__main">');
        html.push('<p class="zf-list__title" style="cursor:pointer">' + ZF.escape(ZF.truncate(item.question, 40)) +
          ' <i class="bi bi-chevron-down" style="font-size:11px;color:var(--zf-ink-3)"></i></p>');
        // 展开详情（直接复用列表数据，无需二次请求）
        html.push('<div class="zf-qa-detail" style="display:none">' + renderAnswerHtml(item) + '</div>');
        html.push('</div>');
        html.push('<div class="zf-list__meta" style="text-align:right">');
        html.push('<span class="zf-badge zf-badge--primary">' + ZF.escape(cat) + '</span><br>');
        html.push('<span class="zf-badge">引用' + refs + '条</span><br>');
        html.push(ZF.escape(item.createdAtText || '') + '<br>');
        html.push('<button class="zf-btn zf-btn--ghost zf-btn--sm js-like" data-id="' + item.id + '" data-count="' + (item.likeCount || 0) + '">' +
          '<i class="bi bi-hand-thumbs-up"></i> <span class="js-like-count">' + (item.likeCount || 0) + '</span></button> ');
        html.push('<button class="zf-btn zf-btn--ghost zf-btn--sm js-del" data-id="' + item.id + '">' +
          '<i class="bi bi-trash"></i></button>');
        html.push('</div></div>');
      });
      html.push('</div>');
      $box.html(html.join(''));
      ZF.renderPager('#history-pager', page, function (p) { loadHistory(p); });
    }).catch(function () {
      ZF.renderEmpty($box, '加载失败，请刷新重试');
    });
  }
})(jQuery, window.ZF);
</script>
</body>
</html>
