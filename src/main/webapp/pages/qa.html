<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能法律问答 - 职小法</title>
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/app.css?v=20260922n">
</head>
<body>

<div class="zf-app zf-app--chat">
  <main class="zf-main">
    <header class="zf-topbar"></header>

    <section class="zf-content zf-content--chat">
      <div class="zf-chat">
        <!-- 会话头部 -->
        <header class="zf-chat__head">
          <div class="zf-chat__head-main">
            <div class="zf-chat__avatar"><i class="bi bi-robot"></i></div>
            <div>
              <h3 class="zf-chat__name">职小法 · 法律问答助手</h3>
              <p class="zf-chat__sub"><span class="zf-chat__dot"></span>基于法规库回答，并附上引用法条原文</p>
            </div>
          </div>
          <div class="zf-chat__spacer"></div>
          <!-- 历史对话：下拉列出过往咨询，点击跳转到该条对话。
               用自研 popover（不是 Bootstrap dropdown），与 zf-chips / zf-tabs 的既有风格一致 -->
          <div class="zf-chat__hist" id="chat-hist">
            <button type="button" class="zf-btn zf-btn--ghost zf-btn--sm" id="chat-hist-btn"
                    aria-haspopup="true" aria-expanded="false" aria-controls="chat-hist-panel"
                    title="查看历史对话">
              <i class="bi bi-clock-history"></i><span class="zf-chat__hist-btn-text">历史对话</span>
              <span class="zf-chat__hist-count" id="chat-hist-count" hidden>0</span>
            </button>
            <div class="zf-chat__hist-panel" id="chat-hist-panel" role="dialog"
                 aria-label="历史对话列表" hidden>
              <div class="zf-chat__hist-head">
                <span class="zf-chat__hist-title">
                  <i class="bi bi-clock-history"></i>全部咨询记录
                  <em class="zf-chat__hist-total" id="chat-hist-total" hidden></em>
                </span>
                <input class="zf-chat__hist-search" id="chat-hist-search" type="text"
                       placeholder="搜索问题关键词…" autocomplete="off">
              </div>
              <div class="zf-chat__hist-list" id="chat-hist-list" role="list"></div>
              <div class="zf-chat__hist-foot" id="chat-hist-foot" hidden>
                <button type="button" class="zf-btn zf-btn--ghost zf-btn--sm" id="chat-hist-more">
                  <i class="bi bi-arrow-down-circle"></i>加载更早
                </button>
              </div>
            </div>
          </div>
          <button class="zf-btn zf-btn--ghost zf-btn--sm" id="chat-new">
            <i class="bi bi-plus-lg"></i>新对话
          </button>
        </header>

        <!-- 消息流：top = 加载更早，list = 对话消息，welcome = 空态 -->
        <div class="zf-chat__body" id="chat-body">
          <div id="chat-top"></div>
          <div id="chat-list"></div>
          <div id="chat-welcome"></div>
        </div>

        <!-- 输入区 -->
        <footer class="zf-chat__foot">
          <form class="zf-chat__composer" id="chat-form" novalidate>
            <select class="zf-chat__cat" id="chat-category" title="问题分类（可选）">
              <option value="">自动判断分类</option>
              <option value="劳动合同">劳动合同</option>
              <option value="劳动报酬">劳动报酬</option>
              <option value="工作时间与休息休假">工作时间与休息休假</option>
              <option value="社会保险">社会保险</option>
              <option value="解除与终止">解除与终止</option>
              <option value="保密与竞业限制">保密与竞业限制</option>
              <option value="其他">其他</option>
            </select>
            <textarea class="zf-chat__input" id="chat-input" rows="1"
              placeholder="描述你遇到的职场法律问题，Enter 发送 / Shift + Enter 换行"></textarea>
            <button type="submit" class="zf-btn zf-btn--primary zf-chat__send" id="chat-send" title="发送">
              <i class="bi bi-send-fill"></i>
            </button>
          </form>
          <p class="zf-chat__tip">回答由系统依据法规库自动生成，仅供参考，不构成正式法律意见</p>
        </footer>
      </div>
    </section>
  </main>
</div>

<script src="../vendor/jquery/jquery.min.js"></script>
<script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../js/common.js?v=20260922n"></script>
<script>
/**
 * @file qa.html —— 智能法律问答（对话式）
 * @description 类聊天窗口的问答界面：欢迎语 + 快捷提问 → 用户气泡 → 等待动画 → 助手气泡（结构化回答 + 可折叠法条引用），
 *              支持复制、点赞、删除；向上可继续加载更早的咨询记录。
 */
(function ($, ZF) {
  'use strict';

  /** 每次拉取的历史条数 */
  var PAGE_SIZE = 10;
  /** 快捷提问示例 */
  var QUICK = [
    '试用期三个月公司不交社保，说转正才给交，合法吗？',
    '公司拖欠我两个月工资，我可以直接离职并要求补偿吗？',
    '离职后公司要求我遵守两年竞业限制，但一直不给补偿，怎么办？',
    '周末强制加班，公司只安排调休不给加班费，是否违法？'
  ];

  /** 已渲染到消息流的问答 id，避免「加载更早」时重复 */
  var rendered = {};
  /** 历史已加载页数 */
  var loadedPages = 0;
  /** 是否正在等待回答 */
  var asking = false;
  /** 当前登录用户 */
  var me = null;

  ZF.initPage({ active: 'qa', title: '智能法律问答', sub: '像聊天一样提问，系统给出结论与法条依据' })
    .then(function (user) {
      me = user;
      renderWelcome();
      bindComposer();
      bindListActions();
      loadHistory(1, 'init');
    });

  /* ==================================================================
   *  渲染
   * ================================================================== */

  /** 空态：欢迎语 + 快捷提问 */
  function renderWelcome() {
    var html = ['<div class="zf-welcome">'];
    html.push('<div class="zf-welcome__avatar"><i class="bi bi-robot"></i></div>');
    html.push('<h3 class="zf-welcome__title">你好，我是职小法</h3>');
    html.push('<p class="zf-welcome__desc">用大白话描述你遇到的职场法律问题，我会给出初步结论、' +
      '对应的法条原文和可执行的建议步骤。描述得越具体，回答越准确。</p>');
    html.push('<div class="zf-quick">');
    QUICK.forEach(function (q) {
      html.push('<button type="button" class="zf-quick__item js-quick" data-q="' + ZF.escape(q) + '">' + ZF.escape(q) + '</button>');
    });
    html.push('</div></div>');
    $('#chat-welcome').html(html.join(''));
  }

  /**
   * 把答案正文转成带层级的 HTML。
   * 后端答案固定为「【初步结论】/【法律依据】/【建议步骤】+ 末尾提示」结构，
   * 这里把【】渲染成小节标题、末尾提示渲染成脚注。
   * @param {string} text 回答原文
   * @returns {string} HTML
   */
  function answerHtml(text) {
    var html = ZF.escape(text || '')
      .replace(/【([^】]+)】/g, '<span class="zf-ans__sec">$1</span>')
      .replace(/(^|\n)(提示：[\s\S]*)$/, '$1<span class="zf-ans__note">$2</span>');
    return html.replace(/\n/g, '<br>');
  }

  /**
   * 引用法条折叠面板。
   * @param {Array} refs 法条数组
   * @returns {string} HTML
   */
  function refsHtml(refs) {
    if (!refs || !refs.length) {
      return '';
    }
    var items = refs.map(function (law) {
      return '<div class="zf-law">' +
        '<div class="zf-law__name">《' + ZF.escape(law.lawName) + '》' + ZF.escape(law.articleNo || '') + '</div>' +
        (law.title ? '<div class="zf-law__text"><strong>' + ZF.escape(law.title) + '</strong></div>' : '') +
        '<div class="zf-law__text">' + ZF.escape(law.content) + '</div>' +
        '</div>';
    }).join('');
    return '<details class="zf-refs"><summary><i class="bi bi-book"></i>引用法条（' + refs.length + '）</summary>' +
      '<div class="zf-refs__items">' + items + '</div></details>';
  }

  /** 用户消息气泡 */
  function userMsgHtml(text) {
    var name = me ? (me.nickname || me.username || '我') : '我';
    return '<div class="zf-msg zf-msg--me">' +
      '<div class="zf-msg__avatar">' + ZF.escape(name.substring(0, 1)) + '</div>' +
      '<div class="zf-msg__main"><div class="zf-msg__bubble">' + ZF.escape(text) + '</div></div>' +
      '</div>';
  }

  /**
   * 助手消息气泡（含法条引用与操作栏）。
   * @param {Object} qa 问答对象
   * @returns {string} HTML
   */
  function aiMsgHtml(qa) {
    var refs = qa.references || [];
    var like = qa.likeCount || 0;
    var html = ['<div class="zf-msg zf-msg--ai">'];
    html.push('<div class="zf-msg__avatar"><i class="bi bi-robot"></i></div>');
    html.push('<div class="zf-msg__main">');
    html.push('<div class="zf-msg__bubble">' + answerHtml(qa.answer) + refsHtml(refs) + '</div>');
    html.push('<div class="zf-msg__meta">' + ZF.escape(qa.createdAtText || ZF.formatDate(qa.createdAt, true) || '刚刚') +
      (qa.category ? ' · ' + ZF.escape(qa.category) : '') + '</div>');
    html.push('<div class="zf-msg__acts">');
    html.push('<button type="button" class="zf-msg__act js-copy"><i class="bi bi-clipboard"></i>复制</button>');
    html.push('<button type="button" class="zf-msg__act js-like" data-id="' + qa.id + '" data-count="' + like + '">' +
      '<i class="bi bi-hand-thumbs-up"></i><span class="js-like-n">' + like + '</span></button>');
    html.push('<button type="button" class="zf-msg__act js-del" data-id="' + qa.id + '"><i class="bi bi-trash"></i>删除</button>');
    html.push('</div></div></div>');
    return html.join('');
  }

  /** 一条问答 = 用户气泡 + 助手气泡，外层包一个便于整组删除的容器 */
  function pairHtml(qa) {
    return '<div class="zf-pair" data-id="' + qa.id + '">' + userMsgHtml(qa.question) + aiMsgHtml(qa) + '</div>';
  }

  /** 等待回答的占位气泡 */
  function appendTyping() {
    $('#chat-list').append('<div class="zf-msg zf-msg--ai" id="chat-typing">' +
      '<div class="zf-msg__avatar"><i class="bi bi-robot"></i></div>' +
      '<div class="zf-msg__main"><div class="zf-msg__bubble">' +
      '<span class="zf-typing"><i></i><i></i><i></i></span> 正在检索法规库…' +
      '</div></div></div>');
  }

  /**
   * 滚动消息流。
   * @param {boolean} [smooth] 是否平滑滚动，默认 true
   */
  function scrollBottom(smooth) {
    var el = $('#chat-body')[0];
    if (!el) {
      return;
    }
    el.scrollTo({ top: el.scrollHeight, behavior: smooth === false ? 'auto' : 'smooth' });
  }

  /* ==================================================================
   *  交互
   * ================================================================== */

  /** 输入框：自动增高 + Enter 发送（兼容中文输入法） */
  function bindComposer() {
    var $input = $('#chat-input');

    $input.on('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 168) + 'px';
    });
    $input.on('keydown', function (e) {
      // isComposing / keyCode 229：中文输入法候选框中的回车不触发发送
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        $('#chat-form').trigger('submit');
      }
    });
    $('#chat-form').on('submit', function (e) {
      e.preventDefault();
      ask($input.val());
    });
    // 快捷提问
    $('#chat-welcome').on('click', '.js-quick', function () {
      ask($(this).data('q'));
    });
    // 新对话：清空当前视图回到欢迎态（历史记录仍在服务端，可再次加载）
    $('#chat-new').on('click', function () {
      ZF.confirm('清空当前对话视图？历史记录不会被删除，可再次加载。').then(function (ok) {
        if (!ok) { return; }
        rendered = {};
        loadedPages = 0;
        histCurrentId = null;   // 对话视图已清空，列表里的强调态同步复位
        $('#chat-list').empty();
        $('#chat-top').empty();
        renderWelcome();
        scrollBottom(false);
      });
    });
    // 加载更早的咨询
    $('#chat-top').on('click', '.js-more', function () {
      loadHistory(loadedPages + 1, 'more');
    });
    bindHistoryPanel();
  }

  /* ==================================================================
   *  历史对话下拉面板
   * ================================================================== */

  /** 面板是否已打开 */
  var histOpen = false;
  /** 面板用的历史缓存（不依赖聊天流，独立分页，含全部历史） */
  var histCache = [];
  /** 面板已加载页数 */
  var histPages = 0;
  /** 面板是否还有更早的 */
  var histHasMore = false;
  /** 历史总条数（服务端 total） */
  var histTotal = 0;
  /** 搜索关键词 */
  var histKeyword = '';
  /**
   * 当前对话 id —— 列表里唯一用于强调的状态。
   * 只在「用户从面板跳转到某条」时置位，默认 null（面板打开时是干净的纯白列表）。
   * 【反面教材】不要用「是否已渲染在聊天流里」来标记：聊天流默认就加载一页，
   * 那会让几乎所有条目都命中强调色（实测 10/10），等于没有强调 —— 这正是旧版
   * `--active` 让整个面板变成一片蓝色的原因。
   */
  var histCurrentId = null;

  /** 绑定历史对话面板的交互 */
  function bindHistoryPanel() {
    var $btn = $('#chat-hist-btn');
    var $panel = $('#chat-hist-panel');

    // 开关
    $btn.on('click', function (e) {
      e.stopPropagation();
      setHistOpen(!histOpen);
    });
    // 点击面板内部不关闭（但点击某条记录要关）
    $panel.on('click', function (e) { e.stopPropagation(); });
    // 点击外部 / Esc 关闭
    $(document).on('click.zfHist', function () { if (histOpen) { setHistOpen(false); } });
    $(document).on('keydown.zfHist', function (e) {
      if (e.key === 'Escape' && histOpen) { setHistOpen(false); $btn.focus(); }
    });

    // 搜索（本地过滤，无需再打接口）
    $('#chat-hist-search').on('input', function () {
      histKeyword = $.trim(this.value).toLowerCase();
      renderHistList();
    });

    // 加载更早
    $('#chat-hist-more').on('click', function () {
      loadHistPage(histPages + 1, true);
    });

    // 点击某条 → 跳转到该对话
    $('#chat-hist-list').on('click', '.zf-chat__hist-item', function () {
      jumpToPair($(this).data('id'));
    });
  }

  /** 打开/关闭面板 */
  function setHistOpen(open) {
    histOpen = !!open;
    $('#chat-hist-panel').prop('hidden', !histOpen);
    $('#chat-hist-btn').attr('aria-expanded', histOpen ? 'true' : 'false');
    if (histOpen) {
      // 每次打开都重新拉第一页，保证列表是最新的
      loadHistPage(1, false);
      setTimeout(function () { $('#chat-hist-search').trigger('focus'); }, 30);
    }
  }

  /**
   * 拉取历史面板的一页数据。
   * @param {number} pageNum 页码
   * @param {boolean} append 是否追加（加载更早）
   */
  function loadHistPage(pageNum, append) {
    var $list = $('#chat-hist-list');
    if (!append) {
      $list.html('<div class="zf-chat__hist-empty">加载中…</div>');
    }
    return ZF.get('/qa/mine', { pageNum: pageNum, pageSize: PAGE_SIZE }).then(function (page) {
      var list = page.list || [];
      if (append) {
        histCache = histCache.concat(list);
      } else {
        histCache = list;
      }
      histPages = Math.max(histPages, pageNum);
      histTotal = page.total || histCache.length;
      // total > 已加载条数说明还有更早的
      histHasMore = histTotal > histCache.length;
      renderHistList();
    }).catch(function () {
      if (!append) {
        $list.html('<div class="zf-chat__hist-empty">历史记录加载失败<br>请稍后重试</div>');
      }
      $('#chat-hist-foot').prop('hidden', true);
    });
  }

  /** 渲染面板列表（含本地关键词过滤） */
  function renderHistList() {
    var $list = $('#chat-hist-list');
    var kw = histKeyword;
    var shown = histCache.filter(function (item) {
      if (!kw) { return true; }
      return String(item.question || '').toLowerCase().indexOf(kw) >= 0;
    });

    // 角标：显示历史总条数
    var $count = $('#chat-hist-count');
    if (histCache.length) {
      $count.text(histCache.length).prop('hidden', false);
    } else {
      $count.prop('hidden', true);
    }
    // 面板标题右侧的总数：已加载 / 全部
    var $total = $('#chat-hist-total');
    if (histTotal) {
      $total.text(histCache.length < histTotal
        ? '已显示 ' + histCache.length + ' / ' + histTotal + ' 条'
        : '共 ' + histTotal + ' 条').prop('hidden', false);
    } else {
      $total.prop('hidden', true);
    }

    if (!shown.length) {
      $list.html('<div class="zf-chat__hist-empty">' +
        (kw ? '没有匹配「' + ZF.escape(histKeyword) + '」的记录' : '还没有历史对话') + '</div>');
      $('#chat-hist-foot').prop('hidden', true);
      return;
    }

    var html = shown.map(function (item) {
      var q = ZF.escape(item.question || '（无标题）');
      var time = ZF.escape(item.createdAtText || ZF.formatDate(item.createdAt, true) || '');
      var cat = item.category ? '<span class="zf-chat__hist-cat">' + ZF.escape(item.category) + '</span>' : '';
      var current = item.id === histCurrentId ? ' zf-chat__hist-item--current' : '';
      return '<button type="button" class="zf-chat__hist-item' + current + '" data-id="' + item.id + '" role="listitem">' +
        '<div class="zf-chat__hist-q">' + q + '</div>' +
        '<div class="zf-chat__hist-meta">' + time + cat + '</div>' +
        '</button>';
    }).join('');
    $list.html(html);

    // 搜索时不再提供「加载更早」（本地过滤已覆盖已加载部分）
    $('#chat-hist-foot').prop('hidden', !histHasMore || !!kw);
  }

  /**
   * 跳转到指定对话：已渲染则滚动 + 脉冲高亮；
   * 未渲染（更早的分页）则先补拉到该页再滚动。
   * @param {number} id 问答 id
   */
  function jumpToPair(id) {
    histCurrentId = id;   // 列表里的唯一强调项，下次打开面板还能看到"我在哪条"
    var $target = $('#chat-list .zf-pair[data-id="' + id + '"]');
    if ($target.length) {
      setHistOpen(false);
      focusPair($target);
      return;
    }
    // 未渲染（更早的分页）：逐页补拉直到出现。
    // 只在需要补拉时才提示，已渲染的情况静默滚动，不打扰。
    ZF.toast('正在定位该对话…', 'info', 1600);
    var tries = 0;
    function pull() {
      tries++;
      // 兜底：最多 12 页，避免异常数据下无限循环
      if (tries > 12) {
        ZF.toast('该对话较久远，未能定位', 'warn');
        return;
      }
      loadHistory(loadedPages + 1, 'more').then(function () {
        var $t = $('#chat-list .zf-pair[data-id="' + id + '"]');
        if ($t.length) {
          setHistOpen(false);
          focusPair($t);
        } else if ($('#chat-top').find('.js-more').length === 0) {
          // 服务端已无更早记录，再拉也没用，直接收手
          ZF.toast('该对话较久远，未能定位', 'warn');
        } else {
          pull();
        }
      });
    }
    pull();
  }

  /** 滚动到某条对话并做一次高亮脉冲 */
  function focusPair($el) {
    var el = $el[0];
    // 用 chat-body 的 scrollTop 精确滚动（scrollIntoView 会被外层容器干扰）
    var body = $('#chat-body')[0];
    body.scrollTop = Math.max(0, el.offsetTop - body.offsetTop - 12);
    $el.addClass('zf-pair--flash');
    setTimeout(function () { $el.removeClass('zf-pair--flash'); }, 1600);
  }

  /**
   * 提问并渲染回答。
   * @param {string} raw 用户输入
   */
  function ask(raw) {
    var q = $.trim(raw || '');
    if (asking) {
      ZF.toast('上一条还在思考中，请稍候', 'info');
      return;
    }
    if (q.length < 4) {
      ZF.toast('请把问题描述得再具体一点（不少于 4 个字）', 'warn');
      $('#chat-input').focus();
      return;
    }
    if (q.length > 1000) {
      ZF.toast('问题太长了，请精简到 1000 字以内', 'warn');
      return;
    }
    asking = true;
    $('#chat-welcome').empty();
    $('#chat-top').empty();
    // 先用一个只含用户气泡的 pair 占位，回答回来后由后端记录替换为完整问答
    $('#chat-list').append('<div class="zf-pair zf-pair--pending">' + userMsgHtml(q) + '</div>');
    appendTyping();
    scrollBottom();

    var $input = $('#chat-input');
    var category = $('#chat-category').val() || '';   // 先取值，再复位下拉框
    $input.val('').css('height', 'auto');
    $('#chat-category').val('');
    ZF.btnLoading($('#chat-send'), true, '');

    ZF.post('/qa', { question: q, category: category }).then(function (qa) {
      $('#chat-typing').remove();
      $('.zf-pair--pending').last().replaceWith(pairHtml(qa));
      rendered[qa.id] = true;
      scrollBottom();
      updateMoreButton();
    }).catch(function () {
      $('#chat-typing').remove();
      $('.zf-pair--pending').last().addClass('zf-pair--failed');
      $('#chat-list').append('<div class="zf-msg zf-msg--ai">' +
        '<div class="zf-msg__avatar"><i class="bi bi-exclamation-triangle"></i></div>' +
        '<div class="zf-msg__main"><div class="zf-msg__bubble">抱歉，这次没能给出回答，请稍后再试或换个说法提问。</div></div></div>');
      scrollBottom();
    }).then(function () {
      asking = false;
      ZF.btnLoading($('#chat-send'), false);
    });
  }

  /** 消息流内的复制 / 点赞 / 删除 */
  function bindListActions() {
    var $list = $('#chat-list');

    $list.on('click', '.js-copy', function () {
      var $pair = $(this).closest('.zf-pair');
      var text = $.trim($pair.find('.zf-msg--me .zf-msg__bubble').text()) +
        '\n\n' + $.trim($pair.find('.zf-msg--ai .zf-msg__bubble').text());
      ZF.copyText(text, '已复制问答内容');
    });

    $list.on('click', '.js-like', function () {
      var $btn = $(this);
      if ($btn.prop('disabled')) {
        return;
      }
      ZF.post('/qa/' + $btn.data('id') + '/like', {}, { silent: true }).then(function () {
        var n = (parseInt($btn.data('count'), 10) || 0) + 1;
        $btn.data('count', n).addClass('zf-msg__act--on').prop('disabled', true)
          .find('.js-like-n').text(n);
      }).catch(function () { /* 静默失败，不打扰用户 */ });
    });

    $list.on('click', '.js-del', function () {
      var $btn = $(this);
      var id = $btn.data('id');
      ZF.confirm('确定删除这条问答记录吗？删除后无法恢复。').then(function (ok) {
        if (!ok) { return; }
        ZF.del('/qa/' + id).then(function () {
          $('.zf-pair[data-id="' + id + '"]').remove();
          delete rendered[id];
          ZF.toast('已删除', 'success');
          if (!$('#chat-list').children().length) {
            $('#chat-top').empty();
            renderWelcome();
          }
        }).catch(function () { /* 统一提示 */ });
      });
    });
  }

  /* ==================================================================
   *  历史记录
   * ================================================================== */

  /**
   * 拉取我自己的问答记录并渲染。
   * @param {number} pageNum 页码
   * @param {string} mode init 初始化（追加到末尾） | more 加载更早（插到最前）
   */
  function loadHistory(pageNum, mode) {
    return ZF.get('/qa/mine', { pageNum: pageNum, pageSize: PAGE_SIZE }).then(function (page) {
      var list = page.list || [];
      // 接口按时间倒序返回，聊天窗口需要正序展示；已渲染过的跳过，防止重复
      var ordered = list.slice().reverse().filter(function (item) {
        return !rendered[item.id];
      });
      if (!ordered.length) {
        if (mode === 'more') {
          ZF.toast('没有更早的咨询记录了', 'info');
        }
        updateMoreButton(page);
        return;
      }
      var html = ordered.map(function (item) {
        rendered[item.id] = true;
        return pairHtml(item);
      }).join('');

      if (mode === 'more') {
        // 记录插入前的高度，插入后按差值补偿滚动位置，视觉上不跳动
        var el = $('#chat-body')[0];
        var before = el.scrollHeight;
        var top = el.scrollTop;
        $('#chat-list').prepend(html);
        el.scrollTop = top + (el.scrollHeight - before);
      } else {
        $('#chat-list').append(html);
        // 已有历史记录时收起欢迎语，让对话本身成为主体
        $('#chat-welcome').empty();
        scrollBottom(false);
      }
      loadedPages = Math.max(loadedPages, pageNum);
      updateMoreButton(page);
    }).catch(function () {
      if (mode !== 'more') {
        $('#chat-welcome').html('<div class="zf-welcome"><p class="zf-welcome__desc">' +
          '历史记录加载失败，可直接在下方输入框提问。</p></div>');
      }
    });
  }

  /**
   * 更新「加载更早」按钮：还有更早的记录才显示。
   * @param {Object} [page] 最近一次分页结果
   */
  function updateMoreButton(page) {
    if (!$('#chat-list').children().length) {
      $('#chat-top').empty();
      return;
    }
    var hasMore = page ? (loadedPages < (page.pages || 0)) : true;
    if (hasMore) {
      $('#chat-top').html('<button type="button" class="zf-btn zf-btn--ghost zf-btn--sm zf-chat__more js-more">' +
        '<i class="bi bi-arrow-up"></i>加载更早的咨询</button>');
    } else {
      $('#chat-top').empty();
    }
  }
})(jQuery, window.ZF);
</script>
</body>
</html>
