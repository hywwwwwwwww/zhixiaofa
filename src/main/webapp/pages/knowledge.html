<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>普法知识广场 - 职小法</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=20261021e">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/app.css?v=20261021e">
</head>
<body class="zf-theme-ink">

<div class="zf-app">
  <main class="zf-main">
    <header class="zf-topbar"></header>

    <section class="zf-content zf-content--kn">
      <!-- 文章区 -->
      <div class="zf-card">
        <div class="zf-card__head">
          <div>
            <h3 class="zf-card__title">普法文章</h3>
            <p class="zf-card__desc">体系化了解劳动法常识，支持分类筛选与全文检索</p>
          </div>
          <div class="zf-card__search">
            <input class="zf-form-control" type="search" id="kw" placeholder="搜索关键词…" aria-label="搜索普法文章">
            <button class="zf-btn zf-btn--primary" id="kw-search" aria-label="搜索"><i class="bi bi-search"></i></button>
          </div>
        </div>
        <div id="cat-filter" class="zf-chips zf-chips--filter" role="group" aria-label="文章分类"></div>
        <div id="article-list"></div>
        <div id="article-pager"></div>
      </div>

      <!-- 知识自测 -->
      <div class="zf-card">
        <div class="zf-card__head">
          <div>
            <h3 class="zf-card__title">知识自测</h3>
            <p class="zf-card__desc">随机抽 10 题，检验你的劳动法掌握程度</p>
          </div>
        </div>
        <div id="quiz-card">
          <button class="zf-btn zf-btn--primary" id="quiz-start">
            <i class="bi bi-patch-question"></i>开始自测
          </button>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- 文章详情弹窗 -->
<div class="modal fade" id="article-modal" tabindex="-1" aria-hidden="true" aria-labelledby="article-modal-title">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content zf-article-modal">
      <div class="zf-article-progress" id="article-progress" aria-hidden="true"></div>
      <div class="modal-header">
        <div class="zf-article-modal__headwrap">
          <h5 class="modal-title" id="article-modal-title">文章详情</h5>
          <div class="zf-article-meta" id="article-modal-meta"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body" id="article-modal-body"></div>
      <div class="modal-footer">
        <button class="zf-btn zf-btn--ghost zf-btn--sm" id="article-guide">
          <i class="bi bi-stars"></i>AI 导读
        </button>
        <button class="zf-btn zf-btn--ghost zf-btn--sm" id="article-like">
          <i class="bi bi-hand-thumbs-up"></i>点赞 <span id="article-like-count">0</span>
        </button>
        <button class="zf-btn zf-btn--ghost zf-btn--sm" id="article-fav" aria-pressed="false" aria-label="收藏">
          <i class="bi bi-star"></i><span id="article-fav-text">收藏</span>
        </button>
        <button class="zf-btn zf-btn--primary" data-bs-dismiss="modal">关闭</button>
      </div>
    </div>
  </div>
</div>

<script src="../vendor/jquery/jquery.min.js"></script>
<script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../js/common.js?v=20261021e"></script>
<script>
/**
 * @file knowledge.html —— 普法知识广场
 * @description 文章分类筛选 + 关键词检索 + 详情弹窗（点赞/收藏）；独立的「知识自测」模块（抽题→作答→解析）。
 */
(function ($, ZF) {
  'use strict';

  /** 当前筛选分类（空=全部） */
  var currentCat = '';
  /** 当前关键词 */
  var keyword = '';
  /** 文章页码 */
  var artPage = 1;
  /** 已出现过的文章分类集合（用于筛选按钮） */
  var catSet = {};
  /** 当前打开的文章（用于点赞/收藏） */
  var currentArticle = null;
  /** 本次自测抽到的题目（用于交卷后回查选项文本） */
  var quizQuestions = [];

  ZF.initPage({ active: 'knowledge', title: '普法知识广场', sub: '读懂劳动法，少走弯路' })
    .then(function () {
      bindSearch();
      bindCatFilter();
      bindArticleModal();
      bindQuiz();
      loadArticles(1);
    });

  /** 搜索框交互 */
  function bindSearch() {
    $('#kw-search').on('click', function () {
      keyword = $.trim($('#kw').val());
      loadArticles(1);
    });
    $('#kw').on('keydown', function (e) {
      if (e.key === 'Enter') { $('#kw-search').click(); }
    });
  }

  /** 渲染分类筛选（.zf-chips 胶囊，与 AI 小法庭 / 文书起草页同一套语言） */
  function renderCatFilter() {
    var cats = Object.keys(catSet);
    var items = ['<button type="button" class="zf-tag' + (currentCat === '' ? ' zf-tag--active' : '') +
      '" data-cat="" aria-pressed="' + (currentCat === '' ? 'true' : 'false') + '">全部</button>'];
    cats.forEach(function (c) {
      var on = (currentCat === c);
      items.push('<button type="button" class="zf-tag' + (on ? ' zf-tag--active' : '') +
        '" data-cat="' + ZF.escape(c) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
        ZF.escape(c) + '</button>');
    });
    $('#cat-filter').html(items.join(''));
  }

  /** 分类筛选事件（#cat-filter 容器常驻，绑定一次即可） */
  function bindCatFilter() {
    $('#cat-filter').on('click', '.zf-tag', function () {
      currentCat = $(this).attr('data-cat') || '';
      renderCatFilter();
      loadArticles(1);
    }).on('keydown', '.zf-tag', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        $(this).trigger('click');
      }
    });
  }

  /**
   * 加载文章分页列表。
   * 宽屏两列卡片网格 —— 原单列每行 987px 里标题只占 162px（84% 是空白），
   * 改两列后同样的内容高度约减半。
   * @param {number} pageNum 页码
   */
  function loadArticles(pageNum) {
    artPage = pageNum || 1;
    var $box = $('#article-list');
    if (!$box.find('.zf-art').length) {
      ZF.renderLoading($box, '加载文章…');
      $box.find('.zf-loading').attr('role', 'status');   // common.js 的 renderLoading 没带
    }
    $box.attr('aria-busy', 'true');
    ZF.get('/knowledge', {
      category: currentCat, keyword: keyword, pageNum: artPage, pageSize: 8
    }).then(function (page) {
      $box.removeAttr('aria-busy');
      // 收集分类用于筛选
      (page.list || []).forEach(function (a) { if (a.category) { catSet[a.category] = true; } });
      renderCatFilter();
      if (!page.list || !page.list.length) {
        ZF.renderEmpty($box, keyword ? '没有匹配的文章' : '暂无文章');
        $('#article-pager').empty();
        return;
      }
      var html = ['<div class="zf-art-grid" aria-label="普法文章列表">'];
      page.list.forEach(function (a) {
        // 标签用中性灰 .zf-badge：一屏十几块淡蓝会重演"一片蓝"，
        // 分类本身不是"当前位置"，不该占用强调色
        var tags = (a.tags || []).map(function (t) {
          return '<span class="zf-badge">' + ZF.escape(t) + '</span>';
        }).join('');
        html.push('<div class="zf-art" role="button" tabindex="0" data-id="' + a.id +
          '" aria-label="打开文章：' + ZF.escape(a.title) + '">');
        html.push('<p class="zf-art__title">' + ZF.escape(a.title) + '</p>');
        html.push('<p class="zf-art__summary">' + ZF.escape(a.summary || '') + '</p>');
        html.push('<div class="zf-art__foot">');
        html.push('<div class="zf-art__tags">' + tags + '</div>');
        // 作者是恒定的"职小法编辑部"，卡片上省略（弹窗里仍展示），只留可比较的阅读/赞
        html.push('<div class="zf-art__meta">' + (a.viewCount || 0) + ' 阅读 · ' + (a.likeCount || 0) + ' 赞</div>');
        html.push('</div></div>');
      });
      html.push('</div>');
      $box.html(html.join(''));
      ZF.renderPager('#article-pager', page, function (p) { loadArticles(p); });
    }).catch(function () {
      $box.removeAttr('aria-busy');
      ZF.renderEmpty($box, '加载失败，请刷新重试');
    });
  }

  /** 文章弹窗：打开、点赞、收藏 */
  function bindArticleModal() {
    /** 打开某篇文章详情（同时后端累计阅读量） */
    function openArticle(id) {
      ZF.get('/knowledge/' + id).then(function (a) {
        currentArticle = a;
        showArticle(a);
      }).catch(function () { /* 统一提示 */ });
    }

    // 整卡可点（卡片是 role=button，内部不再放可聚焦元素，键盘只 Tab 一次）
    $('#article-list').on('click', '.zf-art', function () {
      openArticle($(this).attr('data-id'));
    }).on('keydown', '.zf-art', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openArticle($(this).attr('data-id'));
      }
    });

    // AI 导读：POST 会调模型（登录态由 AuthFilter 兜住），结果缓存在 currentArticle._guide
    $('#article-guide').on('click', function () {
      if (!currentArticle) { return; }
      var $btn = $('#article-guide');
      ZF.btnLoading($btn, true, '生成导读中…');
      ZF.post('/knowledge/' + currentArticle.id + '/guide').then(function (data) {
        ZF.btnLoading($btn, false);
        currentArticle._guide = data;
        renderGuide(data);
      }).catch(function () {
        ZF.btnLoading($btn, false);
      });
    });

    // 点赞
    $('#article-like').on('click', function () {
      if (!currentArticle) { return; }
      ZF.post('/knowledge/' + currentArticle.id + '/like', {}, { silent: true }).then(function () {
        var n = (currentArticle.likeCount || 0) + 1;
        currentArticle.likeCount = n;
        $('#article-like-count').text(n);
        $('#article-like').prop('disabled', true);
        ZF.toast('已点赞', 'success');
      }).catch(function () { /* 忽略 */ });
    });

    // 收藏（toggle，targetType=ARTICLE）
    $('#article-fav').on('click', function () {
      if (!currentArticle) { return; }
      ZF.post('/favorites/toggle', {
        targetType: 'ARTICLE', targetId: currentArticle.id
      }).then(function (faved) {
        setFavState(faved);
        ZF.toast(faved ? '已收藏' : '已取消收藏', faved ? 'success' : 'info');
      }).catch(function () { /* 统一提示 */ });
    });
  }

  /**
   * 长文正文渲染：空行分段；「一、二、…」「【…】」开头的段识别为小节标题。
   * 为什么要分段而不是整体 nl2br：长文动辄两千字，全挤成一坨没法读；
   * 小节标题给出视觉层级后，读者可以先扫标题再挑感兴趣的段落。
   * @param {string} content 文章全文
   * @returns {string} HTML
   */
  function articleBodyHtml(content) {
    // 逐行渲染（不按空行分段——文章内容行间只有单个换行）：
    // 「一、二、…」「【…】」开头的行识别为小节标题，其余行各自成段，行距由 CSS 下边距控制。
    var html = [];
    (content || '').split('\n').forEach(function (line) {
      var s = $.trim(line);
      if (!s) { return; }
      if (/^(一|二|三|四|五|六|七|八|九|十)、/.test(s) || /^【/.test(s)) {
        html.push('<p class="zf-article__h">' + ZF.escape(s) + '</p>');
      } else {
        html.push('<p class="zf-article__p">' + ZF.nl2br(s) + '</p>');
      }
    });
    return html.join('');
  }

  /**
   * 渲染文章详情到弹窗，并初始化收藏状态。
   * @param {Object} a 文章详情
   */
  function showArticle(a) {
    $('#article-modal-title').text(a.title || '文章详情');
    $('#article-guide-box').remove();
    if (a._guide) { renderGuide(a._guide); }   // 同一会话里已生成过的导读直接复用
    // 出处信息行：分类 / 标签 / 作者 / 日期 / 阅读量 —— 这篇东西「是谁、何时发布、被读过多少」
    // 是真实信息，之前只在卡片上展示，读正文时反而看不到。
    var meta = [];
    if (a.category) {
      meta.push('<span class="zf-badge zf-badge--ok">' + ZF.escape(a.category) + '</span>');
    }
    (a.tags || []).forEach(function (t) {
      meta.push('<span class="zf-badge">' + ZF.escape(t) + '</span>');
    });
    if (a.author) {
      meta.push('<span class="zf-article-meta__item">' + ZF.escape(a.author) + '</span>');
    }
    if (a.publishedAt) {
      meta.push('<span class="zf-article-meta__item">发布于 ' + ZF.escape(String(a.publishedAt).slice(0, 10)) + '</span>');
    }
    meta.push('<span class="zf-article-meta__item">' + (a.viewCount || 0) + ' 次阅读</span>');
    $('#article-modal-meta').html(meta.join(''));
    var body = '<div class="zf-doc zf-doc--plain zf-doc--prose">' +
      articleBodyHtml(a.content) + '</div>';
    $('#article-modal-body').html(body);
    bindArticleProgress();
    $('#article-like-count').text(a.likeCount || 0);
    $('#article-like').prop('disabled', false);
    // 查询是否已收藏
    ZF.get('/favorites/exists', { targetType: 'ARTICLE', targetId: a.id }, { silent: true })
      .then(function (exists) { setFavState(!!exists); })
      .catch(function () { setFavState(false); });
    new bootstrap.Modal($('#article-modal')[0]).show();
  }

  /**
   * 绑定阅读进度线：随正文滚动更新弹窗顶部的墨线宽度。
   * scroll 事件不冒泡，无法事件委托，所以在每次渲染后直接绑；
   * 内容不足一屏（scrollHeight==clientHeight）时归零、不显示进度。
   */
  function bindArticleProgress() {
    var $doc = $('#article-modal-body').find('.zf-doc--plain');
    var $bar = $('#article-progress');
    $bar.css('width', '0%');
    if (!$doc.length) { return; }
    $doc.off('scroll.zfprogress').on('scroll.zfprogress', function () {
      var max = this.scrollHeight - this.clientHeight;
      var p = max > 0 ? Math.min(100, Math.round(this.scrollTop / max * 100)) : 0;
      $bar.css('width', p + '%');
    });
  }

  /**
   * 渲染导读卡（插在正文上方）。
   * mode=AI 时徽标显示「AI 导读」；mode=本地 显示「结构导读」——
   * 刻意区分来源：模型写的与本地提取的，用户应当能分辨。
   * @param {Object} data {mode, guide}
   */
  function renderGuide(data) {
    if (!data || !data.guide) { return; }
    var isAi = data.mode === 'AI';
    var head = '<div class="zf-article-guide__head">' +
      '<span class="zf-badge ' + (isAi ? 'zf-badge--ok' : '') + '">' +
      (isAi ? 'AI 导读' : '结构导读') + '</span>' +
      '<span class="zf-article-guide__note">' +
      (isAi ? '由模型根据全文生成，仅供参考' : '模型未启用，已按文章结构自动提取') +
      '</span></div>';
    var box = '<div class="zf-article-guide" id="article-guide-box">' + head +
      '<div class="zf-doc zf-doc--plain zf-doc--prose">' + articleBodyHtml(data.guide) + '</div></div>';
    $('#article-modal-body').find('.zf-doc').first().before(box);
  }

  /**
   * 切换收藏按钮的展示状态。
   * @param {boolean} faved 是否已收藏
   */
  function setFavState(faved) {
    var $fav = $('#article-fav');
    $fav.attr('aria-pressed', faved ? 'true' : 'false');
    $fav.attr('aria-label', faved ? '取消收藏' : '收藏');
    if (faved) {
      $fav.html('<i class="bi bi-star-fill"></i><span id="article-fav-text">已收藏</span>');
    } else {
      $fav.html('<i class="bi bi-star"></i><span id="article-fav-text">收藏</span>');
    }
  }

  /** 知识自测交互 */
  function bindQuiz() {
    $('#quiz-card').on('click', '#quiz-start', startQuiz);
    $('#quiz-card').on('click', '#quiz-submit', submitQuiz);
    $('#quiz-card').on('click', '#quiz-retry', startQuiz);
  }

  /** 开始自测：抽题并渲染作答界面 */
  function startQuiz() {
    ZF.btnLoading($('#quiz-start'), true, '抽题中…');
    ZF.get('/quiz', { limit: 10 }).then(function (qs) {
      if (!qs || !qs.length) {
        ZF.renderEmpty('#quiz-card', '暂无可用的题目');
        return;
      }
      quizQuestions = qs;
      renderQuiz(qs);
    }).catch(function () {
      ZF.renderEmpty('#quiz-card', '抽题失败，请重试');
    }).then(function () {
      ZF.btnLoading($('#quiz-start'), false);
    });
  }

  /**
   * 渲染自测题目（单选）。
   * @param {Array} qs 题目数组
   */
  function renderQuiz(qs) {
    var opts = ['A', 'B', 'C', 'D'];
    var html = ['<p class="zf-subtitle">共 ' + qs.length + ' 题，请逐题选择答案</p>'];
    qs.forEach(function (q, i) {
      html.push('<div class="zf-quiz-q" data-id="' + q.id + '">');
      html.push('<p class="zf-quiz-q__title">' + (i + 1) + '. ' + ZF.escape(q.question) +
        ' <span class="zf-badge">' + ZF.escape(q.category || '') + '</span></p>');
      opts.forEach(function (op) {
        var text = q['option' + op];
        if (text === undefined || text === null || text === '') { return; }
        html.push('<label class="zf-quiz-opt">');
        html.push('<input type="radio" name="quiz-' + q.id + '" value="' + op + '">');
        html.push('<span>' + op + '. ' + ZF.escape(text) + '</span>');
        html.push('</label>');
      });
      html.push('</div>');
    });
    html.push('<div class="zf-actions-end">');
    html.push('<button class="zf-btn zf-btn--primary" id="quiz-submit"><i class="bi bi-check2-circle"></i>交卷</button>');
    html.push('</div>');
    $('#quiz-card').html(html.join(''));
  }

  /** 交卷：收集答案 → 提交 → 展示得分与解析 */
  function submitQuiz() {
    // 收集每题所选答案
    var answers = {};
    var unanswered = 0;
    $('#quiz-card .zf-quiz-q').each(function () {
      var id = $(this).data('id');
      var val = $(this).find('input[type=radio]:checked').val();
      if (!val) { unanswered++; }
      answers[id] = val || '';
    });
    if (unanswered > 0) {
      ZF.toast('还有 ' + unanswered + ' 题未作答', 'warn');
      return;
    }
    var $btn = $('#quiz-submit');
    ZF.btnLoading($btn, true, '阅卷中…');
    ZF.post('/quiz/submit', { answers: answers }).then(function (res) {
      renderQuizResult(res);
      ZF.toast('得分 ' + res.score + ' 分（' + (res.level || '') + '）', 'success');
    }).catch(function () { /* 统一提示 */ }).then(function () {
      ZF.btnLoading($btn, false);
    });
  }

  /**
   * 渲染自测结果与逐题解析。
   * @param {Object} res 提交返回 { total, rightCount, wrongCount, score, level, details[] }
   */
  function renderQuizResult(res) {
    var html = ['<div class="zf-quiz-score">'];
    html.push('<div class="zf-quiz-score__row">');
    html.push('<div><span class="zf-quiz-score__label">得分</span><strong class="zf-quiz-score__value">' + (res.score || 0) + '</strong></div>');
    html.push('<div><span class="zf-quiz-score__label">等级</span><span class="zf-quiz-score__text">' + ZF.escape(res.level || '-') + '</span></div>');
    html.push('<div><span class="zf-quiz-score__label">正确 / 错误</span><span class="zf-quiz-score__text">' + (res.rightCount || 0) + ' / ' + (res.wrongCount || 0) + '</span></div>');
    html.push('<div><span class="zf-quiz-score__label">总题数</span><span class="zf-quiz-score__text">' + (res.total || 0) + '</span></div>');
    html.push('</div></div>');
    html.push('<p class="zf-subtitle">逐题解析</p>');

    // 用抽题时的题目映射出选项文本（提交返回不含选项原文）
    var qMap = {};
    quizQuestions.forEach(function (q) { qMap[q.id] = q; });
    (res.details || []).forEach(function (d, i) {
      var q = qMap[d.questionId] || {};
      var correct = d.correctOption;   // 正确选项字母
      var your = d.yourAnswer;         // 用户所选字母
      html.push('<div class="zf-quiz-q">');
      html.push('<p class="zf-quiz-q__title">' + (i + 1) + '. ' + ZF.escape(d.question) + '</p>');
      ['A', 'B', 'C', 'D'].forEach(function (op) {
        var text = q['option' + op];
        if (text === undefined || text === null || text === '') { return; }
        var cls = 'zf-quiz-opt';
        if (op === correct) { cls += ' zf-quiz-opt--correct'; }
        else if (op === your && your !== correct) { cls += ' zf-quiz-opt--wrong'; }
        html.push('<div class="' + cls + '"><span>' + op + '. ' + ZF.escape(text) + '</span></div>');
      });
      var mark = (correct === your) ? '回答正确' : '回答错误（正确答案 ' + ZF.escape(correct) + '）';
      html.push('<p class="zf-quiz-explain"><strong>' + mark + '</strong><br>' + ZF.nl2br(d.explanation || '') + '</p>');
      html.push('</div>');
    });
    html.push('<div class="zf-actions-end">');
    html.push('<button class="zf-btn zf-btn--primary" id="quiz-retry"><i class="bi bi-arrow-repeat"></i>再来一次</button>');
    html.push('</div>');
    $('#quiz-card').html(html.join(''));
  }
})(jQuery, window.ZF);
</script>
</body>
</html>
