<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>职小法 · 职场新人智能法律伙伴</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20261021e">
<link rel="shortcut icon" href="favicon.ico">
<link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/app.css?v=20261021e">
  <style>
    /* 入口页：做一次轻量的登录态探测，再决定进首页还是登录页 */
    .zf-splash {
      min-height: 100vh; display: grid; place-items: center; text-align: center;
      background: var(--zf-sidebar);
    }
    .zf-splash__mark {
      width: 64px; height: 64px; margin: 0 auto 18px;
      border-radius: 18px; display: grid; place-items: center;
      background: var(--zf-primary); color: #fff; font-size: 22px; font-weight: 700;
    }
    .zf-splash__title { margin: 0; font-size: 26px; font-weight: 700; }
    .zf-splash__sub { margin: 8px 0 0; color: var(--zf-ink-3); font-size: 14px; }
    .zf-splash__links { margin-top: 22px; display: flex; gap: 10px; justify-content: center; }
  </style>
</head>
<body class="zf-theme-ink">

<div class="zf-splash">
  <div>
    <div class="zf-splash__mark">职法</div>
    <h1 class="zf-splash__title">职小法</h1>
    <p class="zf-splash__sub">职场新人的智能法律伙伴 · 正在进入系统…</p>
    <div class="zf-splash__links" id="fallback" style="display:none">
      <a class="zf-btn zf-btn--primary" href="login.html">去登录</a>
      <a class="zf-btn zf-btn--ghost" href="pages/home.html">先逛逛</a>
    </div>
  </div>
</div>

<script src="vendor/jquery/jquery.min.js"></script>
<script src="js/common.js?v=20261021e"></script>
<script>
/**
 * @file 应用入口：探测登录态并跳转到首页或登录页。
 */
(function ($, ZF) {
  'use strict';

  /** 超时兜底：接口不可用时也给出可点的入口，避免白屏 */
  var fallbackTimer = setTimeout(function () {
    $('#fallback').show();
  }, 3000);

  ZF.currentUser().then(function (user) {
    clearTimeout(fallbackTimer);
    window.location.replace(user ? ZF.homeFor(user) : (ZF.CTX + '/login.html'));
  }).catch(function () {
    clearTimeout(fallbackTimer);
    $('#fallback').show();
  });
})(jQuery, window.ZF);
</script>
</body>
</html>
