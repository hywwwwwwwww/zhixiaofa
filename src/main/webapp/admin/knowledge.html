<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章管理 - 职小法后台</title>
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-table/bootstrap-table.min.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>

<div class="zf-app">
  <main class="zf-main">
    <header class="zf-topbar"></header>

    <section class="zf-content">
      <div id="admin-nav"></div>

      <div class="zf-card">
        <div class="zf-card__head">
          <div><h3 class="zf-card__title">普法文章管理</h3>
            <p class="zf-card__desc">发布与管理普法知识文章</p></div>
          <button class="zf-btn zf-btn--primary" id="add-btn"><i class="bi bi-plus-lg"></i>新增文章</button>
        </div>

        <div class="zf-filter">
          <input class="zf-form-control" type="text" id="f-keyword" placeholder="标题 / 作者 / 摘要">
          <input class="zf-form-control" type="text" id="f-category" placeholder="分类">
          <select class="zf-form-control" id="f-status">
            <option value="">全部状态</option>
            <option value="1">已发布</option>
            <option value="0">草稿</option>
          </select>
          <button class="zf-btn zf-btn--primary" id="search-btn"><i class="bi bi-search"></i>查询</button>
          <button class="zf-btn zf-btn--ghost" id="reset-btn"><i class="bi bi-arrow-clockwise"></i>重置</button>
        </div>

        <table id="kb-table" class="zf-table"></table>
      </div>
    </section>
  </main>
</div>

<!-- 文章编辑模态框 -->
<div class="modal fade" id="kbModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="kb-modal-title">新增文章</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="kb-form" novalidate>
        <div class="modal-body">
          <input type="hidden" name="id">
          <div class="zf-field">
            <label class="zf-form-label" for="k-title">标题 <span style="color:var(--zf-danger)">*</span></label>
            <input class="zf-form-control" type="text" name="title" id="k-title" maxlength="120">
            <div class="zf-form-error"></div>
          </div>
          <div class="zf-field">
            <label class="zf-form-label" for="k-summary">摘要</label>
            <textarea class="zf-form-control" name="summary" id="k-summary" rows="2" maxlength="200"></textarea>
          </div>
          <div class="zf-grid zf-grid--3">
            <div class="zf-field">
              <label class="zf-form-label" for="k-category">分类 <span style="color:var(--zf-danger)">*</span></label>
              <input class="zf-form-control" type="text" name="category" id="k-category" maxlength="30">
              <div class="zf-form-error"></div>
            </div>
            <div class="zf-field">
              <label class="zf-form-label" for="k-author">作者 <span style="color:var(--zf-danger)">*</span></label>
              <input class="zf-form-control" type="text" name="author" id="k-author" maxlength="30">
              <div class="zf-form-error"></div>
            </div>
            <div class="zf-field">
              <label class="zf-form-label" for="k-status">状态</label>
              <select class="zf-form-control" name="status" id="k-status">
                <option value="1">已发布</option>
                <option value="0">草稿</option>
              </select>
            </div>
          </div>
          <div class="zf-field">
            <label class="zf-form-label" for="k-tags">标签（逗号分隔）</label>
            <input class="zf-form-control" type="text" name="tags" id="k-tags" maxlength="120" placeholder="如 劳动合同,试用期,加班">
          </div>
          <div class="zf-field">
            <label class="zf-form-label" for="k-content">正文 <span style="color:var(--zf-danger)">*</span></label>
            <textarea class="zf-form-control" name="content" id="k-content" rows="8"></textarea>
            <div class="zf-form-error"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="zf-btn zf-btn--ghost" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="zf-btn zf-btn--primary" id="kb-save"><i class="bi bi-check2"></i>保存</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="../vendor/jquery/jquery.min.js"></script>
<script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../vendor/bootstrap-table/bootstrap-table.min.js"></script>
<script src="../vendor/bootstrap-table/bootstrap-table-zh-CN.min.js"></script>
<script src="../js/common.js"></script>
<script src="admin-common.js"></script>
<script>
/**
 * @file knowledge.html —— 普法文章管理
 * @description 文章的列表、新增、编辑、删除与状态筛选。
 *              标签以查询串 ?tags=标签1,标签2 形式随请求发送。
 */
(function ($, ZF) {
  'use strict';

  /** 当前编辑行的 id（新增时为 null） */
  var editingId = null;

  ZF.initPage({ active: 'knowledge', title: '文章管理', sub: '普法知识文章维护', needAdmin: true })
    .then(function () {
      ZF.renderAdminNav('knowledge');
      initTable();
      bindFilters();
      bindAdd();
      bindKbForm();
    });

  /** 转义或占位 */
  function escOrDash(v) { return v ? ZF.escape(v) : '<span style="color:var(--zf-ink-3)">-</span>'; }

  /** 把逗号分隔标签拆分为数组（去空） */
  function splitTags(str) {
    return (str || '').split(/[,，]/).map(function (s) { return $.trim(s); }).filter(Boolean);
  }

  /** 操作列 */
  function operateFormatter(value, row) {
    return [
      '<button class="zf-btn zf-btn--ghost zf-btn--sm js-edit"><i class="bi bi-pencil"></i>编辑</button>',
      '<button class="zf-btn zf-btn--danger zf-btn--sm js-delete"><i class="bi bi-trash"></i>删除</button>'
    ].join(' ');
  }

  /** 初始化表格 */
  function initTable() {
    ZF.initAdminTable('#kb-table', '/knowledge', {
      pageSize: 10,
      queryParams: function () {
        return {
          keyword: $.trim($('#f-keyword').val()),
          category: $.trim($('#f-category').val()),
          status: $('#f-status').val()
        };
      },
      columns: [
        { field: 'id', title: 'ID', width: 64 },
        { field: 'title', title: '标题', formatter: function (v) { return ZF.escape(ZF.truncate(v, 36)); } },
        { field: 'category', title: '分类', formatter: escOrDash },
        { field: 'author', title: '作者', formatter: escOrDash },
        { field: 'viewCount', title: '阅读', formatter: function (v) { return ZF.escape(String(v || 0)); } },
        { field: 'likeCount', title: '点赞', formatter: function (v) { return ZF.escape(String(v || 0)); } },
        { field: 'status', title: '状态', formatter: function (v) { return ZF.publishBadge(v); } },
        { field: 'publishedAt', title: '发布时间', formatter: function (v) { return ZF.escape(v || '-'); } },
        { field: 'tags', title: '标签', formatter: function (v) {
            if (!v) { return '<span style="color:var(--zf-ink-3)">-</span>'; }
            return ZF.escape(v).split(/[,，]/).map(function (t) {
              return '<span class="zf-badge">' + $.trim(t) + '</span>';
            }).join(' ');
          } },
        { field: 'operate', title: '操作', formatter: operateFormatter, events: operateEvents }
      ]
    });
  }

  /** 操作事件 */
  var operateEvents = {
    'click .js-edit': function (e, v, row) { openEdit(row); },
    'click .js-delete': function (e, v, row) { removeKb(row); }
  };

  /** 绑定筛选 */
  function bindFilters() {
    $('#search-btn').on('click', function () { ZF.refreshTable('#kb-table'); });
    $('#reset-btn').on('click', function () {
      $('#f-keyword').val(''); $('#f-category').val(''); $('#f-status').val('');
      ZF.refreshTable('#kb-table');
    });
    $('#f-keyword, #f-category').on('keydown', function (e) {
      if (e.key === 'Enter') { ZF.refreshTable('#kb-table'); }
    });
  }

  /** 打开新增 */
  function bindAdd() {
    $('#add-btn').on('click', function () {
      editingId = null;
      $('#kb-modal-title').text('新增文章');
      $('#kb-form')[0].reset();
      $('#kb-form').find('[name=id]').val('');
      $('#kb-form').find('[name=status]').val('1');
      ZF.clearValidate($('#kb-form'));
      new bootstrap.Modal($('#kbModal')[0]).show();
    });
  }

  /** 打开编辑并回填 */
  function openEdit(row) {
    editingId = row.id;
    $('#kb-modal-title').text('编辑文章');
    var $f = $('#kb-form');
    ZF.clearValidate($f);
    $f.find('[name=id]').val(row.id);
    $f.find('[name=title]').val(row.title || '');
    $f.find('[name=summary]').val(row.summary || '');
    $f.find('[name=category]').val(row.category || '');
    $f.find('[name=author]').val(row.author || '');
    $f.find('[name=status]').val(row.status === 0 || row.status === '0' ? '0' : '1');
    $f.find('[name=tags]').val(row.tags || '');
    $f.find('[name=content]').val(row.content || '');
    new bootstrap.Modal($('#kbModal')[0]).show();
  }

  /** 保存（新增/编辑） */
  function bindKbForm() {
    $('#kb-form').on('submit', function (e) {
      e.preventDefault();
      var $form = $(this);
      ZF.clearValidate($form);
      if (!ZF.validate($form, {
        title: { required: true, message: '标题不能为空' },
        category: { required: true, message: '分类不能为空' },
        author: { required: true, message: '作者不能为空' },
        content: { required: true, message: '正文不能为空' }
      })) {
        return;
      }
      var tags = splitTags($form.find('[name=tags]').val());
      var payload = {
        title: $.trim($form.find('[name=title]').val()),
        summary: $.trim($form.find('[name=summary]').val()),
        category: $.trim($form.find('[name=category]').val()),
        author: $.trim($form.find('[name=author]').val()),
        status: parseInt($form.find('[name=status]').val(), 10),
        content: $.trim($form.find('[name=content]').val())
      };
      // 标签通过查询串 ?tags=标签1,标签2 发送
      var tagParam = encodeURIComponent(tags.join(','));
      var $btn = $('#kb-save');
      ZF.btnLoading($btn, true, '保存中…');
      var req;
      if (editingId) {
        req = ZF.put('/knowledge/' + editingId + '?tags=' + tagParam, payload);
      } else {
        req = ZF.post('/knowledge?tags=' + tagParam, payload);
      }
      req.then(function () {
        ZF.toast(editingId ? '已更新' : '已发布', 'success');
        bootstrap.Modal.getInstance($('#kbModal')[0]).hide();
        $('#kb-table').bootstrapTable('refresh');
      }).catch(function () { /* 统一提示 */ }).then(function () {
        ZF.btnLoading($btn, false);
      });
    });
  }

  /** 删除文章 */
  function removeKb(row) {
    ZF.confirm('确定删除文章「' + (row.title || '') + '」吗？此操作不可恢复。').then(function (ok) {
      if (!ok) { return; }
      ZF.del('/knowledge/' + row.id).then(function () {
        ZF.toast('已删除', 'success');
        $('#kb-table').bootstrapTable('refresh');
      }).catch(function () { /* 统一提示 */ });
    });
  }
})(jQuery, window.ZF);
</script>
</body>
</html>
