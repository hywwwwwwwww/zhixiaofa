<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 管理端为内部页面：禁用缓存，避免改动后仍加载到旧版本 -->
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
  <title>模板管理 - 职小法管理后台</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=20261021e">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-table/bootstrap-table.min.css">
  <link rel="stylesheet" href="../css/app.css?v=20261021e">
</head>
<body class="zf-admin-page zf-theme-ink">

<div class="zf-app">
  <main class="zf-main">
    <header class="zf-topbar"></header>

    <section class="zf-content">
      <div class="zf-card">

        <div class="zf-filter-bar" id="dt-filter">
          <div class="zf-filter-bar__item">
            <label class="zf-filter-bar__label">关键词</label>
            <input class="zf-form-control" type="text" data-filter="keyword" placeholder="名称 / 编码 / 说明">
          </div>
          <div class="zf-filter-bar__item">
            <label class="zf-filter-bar__label">分类</label>
            <select class="zf-form-control" data-filter="category"></select>
          </div>
          <div class="zf-filter-bar__actions">
            <button class="zf-btn zf-btn--primary" id="search-btn"><i class="bi bi-search"></i>查询</button>
            <button class="zf-btn zf-btn--ghost" id="reset-btn"><i class="bi bi-arrow-clockwise"></i>重置</button>
          </div>
        </div>

        <div class="zf-toolbar">
          <span class="zf-toolbar__count" id="tpl-count">共 0 个模板</span>
          <span class="zf-toolbar__spacer"></span>
          <button class="zf-btn zf-btn--primary" id="add-btn"><i class="bi bi-plus-lg"></i>新增模板</button>
        </div>

        <table id="tpl-table" class="zf-table"></table>
      </div>
    </section>
  </main>
</div>

<!-- 模板编辑模态框 -->
<div class="modal fade" id="tplModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="tpl-modal-title">新增模板</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="tpl-form" novalidate>
        <div class="modal-body">
          <input type="hidden" name="id">
          <div class="zf-grid zf-grid--2">
            <div class="zf-field">
              <label class="zf-form-label" for="t-code">编码 <span style="color:var(--zf-danger)">*</span></label>
              <input class="zf-form-control" type="text" name="code" id="t-code" maxlength="40">
              <div class="zf-form-error"></div>
            </div>
            <div class="zf-field">
              <label class="zf-form-label" for="t-name">名称 <span style="color:var(--zf-danger)">*</span></label>
              <input class="zf-form-control" type="text" name="name" id="t-name" maxlength="60">
              <div class="zf-form-error"></div>
            </div>
          </div>
          <div class="zf-grid zf-grid--2">
            <div class="zf-field">
              <label class="zf-form-label" for="t-category">分类 <span style="color:var(--zf-danger)">*</span></label>
              <select class="zf-form-control" name="category" id="t-category"></select>
              <div class="zf-form-error"></div>
            </div>
            <div class="zf-field">
              <label class="zf-form-label" for="t-sortNo">排序号</label>
              <input class="zf-form-control" type="number" name="sortNo" id="t-sortNo" value="0" min="0">
            </div>
          </div>
          <div class="zf-field">
            <label class="zf-form-label" for="t-description">说明</label>
            <input class="zf-form-control" type="text" name="description" id="t-description" maxlength="120">
          </div>
          <div class="zf-field">
            <label class="zf-form-label" for="t-content">模板正文</label>
            <textarea class="zf-form-control" name="contentTemplate" id="t-content" rows="10" placeholder="例如：甲方（${甲方名称}）与乙方（${乙方名称}）于 ${签订日期} 签订本合同……"></textarea>
            <div class="zf-form-hint">占位符写作 ${字段名}，生成文书时会替换为填写内容</div>
          </div>
          <div class="zf-field">
            <label class="zf-form-label">是否启用</label>
            <select class="zf-form-control" name="enabled" id="t-enabled">
              <option value="1">启用</option>
              <option value="0">停用</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="zf-btn zf-btn--ghost" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="zf-btn zf-btn--primary" id="tpl-save"><i class="bi bi-check2"></i>保存</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- 模板查看模态框 -->
<div class="modal fade" id="viewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">模板详情</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="view-body"></div>
    </div>
  </div>
</div>

<script src="../vendor/jquery/jquery.min.js"></script>
<script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../vendor/bootstrap-table/bootstrap-table.min.js"></script>
<script src="../vendor/bootstrap-table/bootstrap-table-zh-CN.min.js"></script>
<script src="../js/common.js?v=20261021e"></script>
<script src="admin-common.js?v=20261021e"></script>
<script>
/**
 * @file doc-templates.html —— 文书模板管理
 * @description 模板的列表、筛选、查看、新增、编辑、启用/停用与删除。
 *              注意：列表接口必须带 page=1 才会返回分页结构。
 *              模板正文使用 ${字段名} 作为占位符（字面量，非 JS 模板字符串）。
 */
(function ($, ZF) {
  'use strict';

  /** 当前编辑行的 id（新增时为 null） */
  var editingId = null;

  ZF.initAdminPage({ active: 'templates', title: '模板管理', sub: '文书模板维护' })
    .then(function () {
      initCategorySelect();
      initTable();
      bindFilters();
      bindAdd();
      bindTplForm();
    });

  /** 初始化分类下拉：筛选栏（含「全部分类」）+ 表单。
   *  注意模板分类是「文书性质」（函件/申请/通知/仲裁），与文章、题库的职场分类不是同一维度。 */
  function initCategorySelect() {
    var cats = ZF.TEMPLATE_CATEGORIES;
    $('#dt-filter [data-filter="category"]').html(ZF.categoryOptions(cats, '全部分类'));
    $('#t-category').html(ZF.categoryOptions(cats));
  }

  /**
   * 回填分类下拉；若当前值不在预设清单里（历史数据），临时补一个选项，
   * 避免编辑保存时被静默改成第一个分类。
   */
  function setCategoryValue(value) {
    var v = $.trim(value || '');
    var $sel = $('#t-category');
    $sel.find('option[data-legacy]').remove();
    if (v && ZF.TEMPLATE_CATEGORIES.indexOf(v) < 0) {
      $sel.append('<option data-legacy="1" value="' + ZF.escape(v) + '">' + ZF.escape(v) + '（历史值）</option>');
    }
    $sel.val(v || ZF.TEMPLATE_CATEGORIES[0]);
  }

  /**
   * 从模板正文中提取去重后的占位符列表。
   * @param {string} content 模板正文
   * @returns {Array<string>} 占位符字段名数组（已去重、保序）
   */
  function extractPlaceholders(content) {
    var set = {};
    var out = [];
    var re = /\$\{([^}]+)\}/g;
    var m;
    while ((m = re.exec(content || '')) !== null) {
      var name = $.trim(m[1]);
      if (name && !set[name]) {
        set[name] = true;
        out.push(name);
      }
    }
    return out;
  }

  /**
   * 操作列：查看 / 编辑 / 停用启用 / 删除。
   * @param {*} value 单元格值（未使用）
   * @param {Object} row 当前行数据
   * @returns {string} 操作按钮组 HTML
   */
  function operateFormatter(value, row) {
    var toggle = row.enabled
      ? '<button class="zf-btn zf-btn--icon zf-btn--ghost js-toggle" title="停用" aria-label="停用"><i class="bi bi-pause-circle"></i></button>'
      : '<button class="zf-btn zf-btn--icon zf-btn--ghost js-toggle" title="启用" aria-label="启用"><i class="bi bi-play-circle"></i></button>';
    return [
      '<div class="zf-actions">',
      '<button class="zf-btn zf-btn--icon zf-btn--ghost js-view" title="查看" aria-label="查看"><i class="bi bi-eye"></i></button>',
      '<button class="zf-btn zf-btn--icon zf-btn--ghost js-edit" title="编辑" aria-label="编辑"><i class="bi bi-pencil"></i></button>',
      toggle,
      '<button class="zf-btn zf-btn--icon zf-btn--danger js-delete" title="删除" aria-label="删除"><i class="bi bi-trash"></i></button>',
      '</div>'
    ].join('');
  }

  /** 初始化表格：管理端分页走专用的 /doc-templates/page 端点 */
  function initTable() {
    ZF.initAdminTable('#tpl-table', '/doc-templates/page', {
      pageSize: 10,
      queryParams: function () {
        // 与其它管理页保持一致：只传筛选条件，分页参数由 ZF.initAdminTable 统一附加（pageNum / pageSize）。
        // 此前这里硬塞 `page: 1` 是为了让后端走「分页分支」——后端已按端点区分职责，不再需要。
        return ZF.filterParams('#dt-filter');
      },
      columns: [
        { field: 'id', title: 'ID', width: 64 },
        { field: 'code', title: '编码', formatter: function (v) { return ZF.escape(v || ''); } },
        { field: 'name', title: '名称', formatter: function (v) { return ZF.escape(v || ''); } },
        { field: 'category', title: '分类', formatter: function (v) {
            return v ? '<span class="zf-badge">' + ZF.escape(v) + '</span>' : '<span style="color:var(--zf-ink-3)">-</span>';
          } },
        { field: 'description', title: '说明', formatter: function (v) { return ZF.escape(ZF.truncate(v, 30)); } },
        { field: 'sortNo', title: '排序', formatter: function (v) { return ZF.escape(String(v || 0)); } },
        { field: 'enabled', title: '状态', formatter: function (v) { return ZF.enabledBadge(v); } },
        { field: 'operate', title: '操作', formatter: operateFormatter, events: operateEvents }
      ]
    });

    // 列表加载成功后刷新顶部计数
    $('#tpl-table').on('load-success.bs.table', function (e, data) {
      var total = (data && data.total) || 0;
      $('#tpl-count').text('共 ' + total + ' 个模板');
    });
  }

  /** 操作事件 */
  var operateEvents = {
    'click .js-view': function (e, v, row) { openView(row); },
    'click .js-edit': function (e, v, row) { openEdit(row); },
    'click .js-toggle': function (e, v, row) { toggleEnabled(row); },
    'click .js-delete': function (e, v, row) { removeTpl(row); }
  };

  /** 绑定筛选与重置 */
  function bindFilters() {
    $('#search-btn').on('click', function () { ZF.refreshTable('#tpl-table'); });
    $('#reset-btn').on('click', function () {
      $('#dt-filter [data-filter]').val('');
      ZF.refreshTable('#tpl-table');
    });
    $('#dt-filter [data-filter]').on('keydown', function (e) {
      if (e.key === 'Enter') { ZF.refreshTable('#tpl-table'); }
    });
  }

  /** 打开新增 */
  function bindAdd() {
    $('#add-btn').on('click', function () {
      editingId = null;
      $('#tpl-modal-title').text('新增模板');
      $('#tpl-form')[0].reset();
      $('#tpl-form').find('[name=id]').val('');
      $('#tpl-form').find('[name=sortNo]').val('0');
      $('#tpl-form').find('[name=enabled]').val('1');
      ZF.clearValidate($('#tpl-form'));
      bootstrap.Modal.getOrCreateInstance($('#tplModal')[0]).show();
    });
  }

  /** 打开查看（展示正文与识别出的占位符） */
  function openView(row) {
    var placeholders = extractPlaceholders(row.contentTemplate);
    var phHtml = placeholders.length
      ? placeholders.map(function (n) {
          return '<span class="zf-badge zf-badge--primary">' + ZF.escape(n) + '</span>';
        }).join(' ')
      : '<span style="color:var(--zf-ink-3)">无占位符</span>';
    var html = '<div class="zf-detail-grid">' +
      '<div class="zf-detail-grid__item"><div class="zf-detail-grid__label">编码</div>' +
        '<div class="zf-detail-grid__value">' + ZF.escape(row.code || '') + '</div></div>' +
      '<div class="zf-detail-grid__item"><div class="zf-detail-grid__label">名称</div>' +
        '<div class="zf-detail-grid__value">' + ZF.escape(row.name || '') + '</div></div>' +
      '<div class="zf-detail-grid__item"><div class="zf-detail-grid__label">分类</div>' +
        '<div class="zf-detail-grid__value">' + (row.category ? '<span class="zf-badge">' + ZF.escape(row.category) + '</span>' : '-') + '</div></div>' +
      '<div class="zf-detail-grid__item"><div class="zf-detail-grid__label">排序号</div>' +
        '<div class="zf-detail-grid__value">' + ZF.escape(String(row.sortNo != null ? row.sortNo : 0)) + '</div></div>' +
      '<div class="zf-detail-grid__item"><div class="zf-detail-grid__label">状态</div>' +
        '<div class="zf-detail-grid__value">' + ZF.enabledBadge(row.enabled) + '</div></div>' +
      '</div>' +
      (row.description ? '<div class="zf-detail-full"><div class="zf-detail-grid__label">说明</div>' +
        '<div class="zf-detail-grid__value">' + ZF.escape(row.description) + '</div></div>' : '') +
      '<div class="zf-detail-grid__label">模板正文</div>' +
      '<div class="zf-doc">' + ZF.escape(row.contentTemplate || '') + '</div>' +
      '<div class="zf-detail-full"><div class="zf-detail-grid__label">占位符</div>' + phHtml + '</div>';
    $('#view-body').html(html);
    bootstrap.Modal.getOrCreateInstance($('#viewModal')[0]).show();
  }

  /** 打开编辑并回填 */
  function openEdit(row) {
    editingId = row.id;
    $('#tpl-modal-title').text('编辑模板');
    var $f = $('#tpl-form');
    ZF.clearValidate($f);
    $f.find('[name=id]').val(row.id);
    $f.find('[name=code]').val(row.code || '');
    $f.find('[name=name]').val(row.name || '');
    setCategoryValue(row.category);
    $f.find('[name=description]').val(row.description || '');
    $f.find('[name=contentTemplate]').val(row.contentTemplate || '');
    $f.find('[name=sortNo]').val(row.sortNo != null ? row.sortNo : 0);
    $f.find('[name=enabled]').val(row.enabled ? '1' : '0');
    bootstrap.Modal.getOrCreateInstance($('#tplModal')[0]).show();
  }

  /** 保存（新增/编辑） */
  function bindTplForm() {
    $('#tpl-form').on('submit', function (e) {
      e.preventDefault();
      var $form = $(this);
      ZF.clearValidate($form);
      if (!ZF.validate($form, {
        code: { required: true, message: '编码不能为空' },
        name: { required: true, message: '名称不能为空' },
        category: { required: true, message: '分类不能为空' }
      })) {
        return;
      }
      var payload = {
        code: $.trim($form.find('[name=code]').val()),
        name: $.trim($form.find('[name=name]').val()),
        category: $.trim($form.find('[name=category]').val()),
        description: $.trim($form.find('[name=description]').val()),
        contentTemplate: $form.find('[name=contentTemplate]').val(),
        sortNo: parseInt($form.find('[name=sortNo]').val(), 10) || 0,
        // 后端 enabled 是 Integer：必须传数字 1/0。
        // 传布尔值会让 Jackson 报「Cannot deserialize value of type Integer from Boolean」，
        // 导致新增/编辑整体失败（与 users/knowledge 页的写法保持一致）。
        enabled: parseInt($form.find('[name=enabled]').val(), 10) || 0
      };
      var $btn = $('#tpl-save');
      ZF.btnLoading($btn, true, '保存中…');
      var req = editingId
        ? ZF.put('/doc-templates/' + editingId, payload)
        : ZF.post('/doc-templates', payload);
      req.then(function () {
        ZF.toast(editingId ? '已更新' : '已新增', 'success');
        bootstrap.Modal.getOrCreateInstance($('#tplModal')[0]).hide();
        $('#tpl-table').bootstrapTable('refresh');
      }).catch(function () { /* 统一提示 */ }).then(function () {
        ZF.btnLoading($btn, false);
      });
    });
  }

  /** 启用/停用：只提交 enabled 一个字段，避免整行提交覆盖其它字段 */
  function toggleEnabled(row) {
    // 后端 enabled 是 Integer：必须传数字 1/0（传布尔会反序列化失败）
    var next = row.enabled === 1 ? 0 : 1;
    ZF.confirm(next === 1 ? '确定启用该模板吗？' : '确定停用该模板吗？').then(function (ok) {
      if (!ok) { return; }
      ZF.put('/doc-templates/' + row.id + '/enabled', { enabled: next }).then(function () {
        ZF.toast(next === 1 ? '已启用' : '已停用', 'success');
        $('#tpl-table').bootstrapTable('refresh');
      }).catch(function () { /* 统一提示 */ });
    });
  }

  /** 删除模板（被用户使用时会返回业务错误，由底层统一提示透出） */
  function removeTpl(row) {
    ZF.confirm('确定删除模板「' + ZF.escape(row.name || '') + '」吗？此操作不可恢复。').then(function (ok) {
      if (!ok) { return; }
      ZF.del('/doc-templates/' + row.id).then(function () {
        ZF.toast('已删除', 'success');
        $('#tpl-table').bootstrapTable('refresh');
      }).catch(function () { /* 统一提示（含「模板已被用户使用」业务错误） */ });
    });
  }
})(jQuery, window.ZF);
</script>
</body>
</html>
