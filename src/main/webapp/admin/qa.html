<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>问答管理 - 职小法后台</title>
  <link rel="stylesheet" href="../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../vendor/bootstrap-table/bootstrap-table.min.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>

<div class="zf-app">
  <main class="zf-main">
    <header class="zf-topbar"></header>

    <section class="zf-content">
      <div id="admin-nav"></div>

      <div class="zf-card">
        <div class="zf-card__head"><div><h3 class="zf-card__title">问答记录管理</h3>
          <p class="zf-card__desc">查看用户咨询、补充回答、管理风险词条</p></div></div>

        <div class="zf-filter">
          <input class="zf-form-control" type="text" id="f-keyword" placeholder="提问人 / 问题关键词">
          <input class="zf-form-control" type="text" id="f-category" placeholder="分类">
          <select class="zf-form-control" id="f-status">
            <option value="">全部状态</option>
            <option value="1">已回答</option>
            <option value="0">未回答</option>
          </select>
          <button class="zf-btn zf-btn--primary" id="search-btn"><i class="bi bi-search"></i>查询</button>
          <button class="zf-btn zf-btn--ghost" id="reset-btn"><i class="bi bi-arrow-clockwise"></i>重置</button>
        </div>

        <table id="qa-table" class="zf-table"></table>
      </div>
    </section>
  </main>
</div>

<!-- 问答详情模态框 -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">问答详情</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detail-body"><div class="zf-loading">加载中…</div></div>
      <div class="modal-footer">
        <button type="button" class="zf-btn zf-btn--primary" id="detail-edit"><i class="bi bi-pencil"></i>补充/修改回答</button>
        <button type="button" class="zf-btn zf-btn--ghost" data-bs-dismiss="modal">关闭</button>
      </div>
    </div>
  </div>
</div>

<!-- 编辑回答模态框 -->
<div class="modal fade" id="answerModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">编辑回答</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="answer-form" novalidate>
        <div class="modal-body">
          <input type="hidden" name="id">
          <div class="zf-field">
            <label class="zf-form-label">原问题</label>
            <div class="zf-quote" id="answer-question"></div>
          </div>
          <div class="zf-field">
            <label class="zf-form-label" for="a-answer">回答内容</label>
            <textarea class="zf-form-control" name="answer" id="a-answer" rows="10" placeholder="输入或补充回答内容…"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="zf-btn zf-btn--ghost" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="zf-btn zf-btn--primary" id="answer-save"><i class="bi bi-check2"></i>保存回答</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="../vendor/jquery/jquery.min.js"></script>
<script src="../vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../vendor/bootstrap-table/bootstrap-table.min.js"></script>
<script src="../vendor/bootstrap-table/bootstrap-table-zh-CN.min.js"></script>
<script src="../js/common.js"></script>
<script src="admin-common.js"></script>
<script>
/**
 * @file qa.html —— 问答记录管理
 * @description 分页展示用户问答，支持关键词/分类/状态筛选；
 *              查看详情（含引用法条）、补充或修改回答、删除。
 */
(function ($, ZF) {
  'use strict';

  /** 当前操作行 */
  var current = null;

  ZF.initPage({ active: 'qa', title: '问答管理', sub: '用户咨询与回答维护', needAdmin: true })
    .then(function () {
      ZF.renderAdminNav('qa');
      initTable();
      bindFilters();
      bindDetail();
      bindAnswerForm();
    });

  /** 问答状态徽标：1 已回答 / 0 未回答 */
  function qaStatusBadge(status) {
    return status === 1 || status === '1'
      ? '<span class="zf-badge zf-badge--ok">已回答</span>'
      : '<span class="zf-badge zf-badge--mid">未回答</span>';
  }

  /** 操作列 */
  function operateFormatter(value, row) {
    return [
      '<button class="zf-btn zf-btn--ghost zf-btn--sm js-detail"><i class="bi bi-eye"></i>详情</button>',
      '<button class="zf-btn zf-btn--ghost zf-btn--sm js-edit"><i class="bi bi-pencil"></i>回答</button>',
      '<button class="zf-btn zf-btn--danger zf-btn--sm js-delete"><i class="bi bi-trash"></i>删除</button>'
    ].join(' ');
  }

  /** 初始化表格 */
  function initTable() {
    ZF.initAdminTable('#qa-table', '/qa', {
      pageSize: 10,
      queryParams: function () {
        return {
          keyword: $.trim($('#f-keyword').val()),
          category: $.trim($('#f-category').val()),
          status: $('#f-status').val()
        };
      },
      columns: [
        { field: 'id', title: 'ID', width: 64 },
        { field: 'userNickname', title: '提问人', formatter: function (v) { return ZF.escape(v || '匿名'); } },
        { field: 'question', title: '问题', formatter: function (v) { return ZF.escape(ZF.truncate(v, 40)); } },
        { field: 'category', title: '分类', formatter: function (v) { return v ? ZF.escape(v) : '<span style="color:var(--zf-ink-3)">-</span>'; } },
        { field: 'status', title: '状态', formatter: qaStatusBadge },
        { field: 'likeCount', title: '点赞', formatter: function (v) { return ZF.escape(String(v || 0)); } },
        { field: 'createdAt', title: '时间', formatter: function (v) { return ZF.dt(v); } },
        { field: 'operate', title: '操作', formatter: operateFormatter, events: operateEvents }
      ]
    });
  }

  /** 操作事件 */
  var operateEvents = {
    'click .js-detail': function (e, v, row) { openDetail(row); },
    'click .js-edit': function (e, v, row) { openAnswer(row); },
    'click .js-delete': function (e, v, row) { removeQa(row); }
  };

  /** 绑定筛选 */
  function bindFilters() {
    $('#search-btn').on('click', function () { ZF.refreshTable('#qa-table'); });
    $('#reset-btn').on('click', function () {
      $('#f-keyword').val(''); $('#f-category').val(''); $('#f-status').val('');
      ZF.refreshTable('#qa-table');
    });
    $('#f-keyword, #f-category').on('keydown', function (e) {
      if (e.key === 'Enter') { ZF.refreshTable('#qa-table'); }
    });
  }

  /** 打开详情：拉取详情（含引用法条） */
  function openDetail(row) {
    current = row;
    var $body = $('#detail-body');
    ZF.renderLoading($body, '加载详情…');
    new bootstrap.Modal($('#detailModal')[0]).show();
    ZF.get('/qa/' + row.id).then(function (d) {
      d = d || row;
      var html = ['<div class="zf-bubble zf-bubble--q">' + ZF.escape(d.question || '') + '</div>'];
      html.push('<div class="zf-bubble zf-bubble--a">' + (d.answer ? ZF.nl2br(d.answer) : '<span style="color:var(--zf-ink-3)">暂无回答</span>') + '</div>');
      var refs = d.references || [];
      html.push('<p class="zf-subtitle" style="margin-top:14px">引用法条（' + refs.length + '）</p>');
      if (!refs.length) {
        html.push('<p style="color:var(--zf-ink-3);font-size:12.5px">无引用法条</p>');
      } else {
        refs.forEach(function (r) {
          html.push('<div class="zf-law">');
          html.push('<div class="zf-law__name">' + ZF.escape(r.lawName || '') +
            (r.articleNo ? ' ' + ZF.escape(r.articleNo) : '') + '</div>');
          if (r.content) { html.push('<div class="zf-law__text">' + ZF.escape(r.content) + '</div>'); }
          html.push('</div>');
        });
      }
      $body.html(html.join(''));
    }).catch(function () {
      ZF.renderEmpty($body, '详情加载失败');
    });
  }

  /** 详情弹窗内「编辑回答」按钮 */
  function bindDetail() {
    $('#detail-edit').on('click', function () {
      if (current) {
        bootstrap.Modal.getInstance($('#detailModal')[0]).hide();
        openAnswer(current);
      }
    });
  }

  /** 打开编辑回答模态框 */
  function openAnswer(row) {
    current = row;
    var $f = $('#answer-form');
    ZF.clearValidate($f);
    $f.find('[name=id]').val(row.id);
    $('#answer-question').text(row.question || '');
    // 若已有详情缓存则直接用，否则再拉一次取最新回答
    ZF.get('/qa/' + row.id, null, { silent: true }).then(function (d) {
      $('#a-answer').val((d && d.answer) || '');
    }).catch(function () {
      $('#a-answer').val(row.answer || '');
    });
    new bootstrap.Modal($('#answerModal')[0]).show();
  }

  /** 保存回答 */
  function bindAnswerForm() {
    $('#answer-form').on('submit', function (e) {
      e.preventDefault();
      var $form = $(this);
      ZF.clearValidate($form);
      if (!$.trim($form.find('[name=answer]').val())) {
        $form.find('[name=answer]').closest('.zf-field').addClass('zf-field--invalid')
          .find('.zf-form-error').text('回答内容不能为空');
        return;
      }
      var $btn = $('#answer-save');
      ZF.btnLoading($btn, true, '保存中…');
      ZF.put('/qa/' + current.id + '/answer', {
        answer: $.trim($form.find('[name=answer]').val())
      }).then(function () {
        ZF.toast('回答已保存', 'success');
        bootstrap.Modal.getInstance($('#answerModal')[0]).hide();
        $('#qa-table').bootstrapTable('refresh');
      }).catch(function () { /* 统一提示 */ }).then(function () {
        ZF.btnLoading($btn, false);
      });
    });
  }

  /** 删除问答 */
  function removeQa(row) {
    ZF.confirm('确定删除该问答记录吗？此操作不可恢复。').then(function (ok) {
      if (!ok) { return; }
      ZF.del('/qa/' + row.id).then(function () {
        ZF.toast('已删除', 'success');
        $('#qa-table').bootstrapTable('refresh');
      }).catch(function () { /* 统一提示 */ });
    });
  }
})(jQuery, window.ZF);
</script>
</body>
</html>
